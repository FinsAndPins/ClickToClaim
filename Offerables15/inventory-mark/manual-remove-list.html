<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offerables15 · Remove from Whatnot clone</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #1a2030;
    --line: #2e3848;
    --text: #eef3fb;
    --muted: #8fa0b8;
    --accent: #5aa8ff;
    --warn: #ffb020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: 32px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,18,24,.97);
    border-bottom: 1px solid var(--line);
    padding: 12px 14px calc(12px + env(safe-area-inset-top));
  }
  header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
  header p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; max-width: 760px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center;
  }
  a.btn, button {
    font: inherit; font-size: 13px; font-weight: 700;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text);
    padding: 9px 12px; text-decoration: none; cursor: pointer;
  }
  button.primary { background: #1a4a7a; border-color: var(--accent); }
  #summary {
    margin: 12px 14px 0; padding: 12px 14px; border-radius: 12px;
    background: #1a2438; border: 1px solid #33507a; max-width: 620px;
    font-size: 14px; line-height: 1.55;
  }
  #summary strong { color: #9ec8ff; }
  #summary .skip { color: var(--muted); font-size: 13px; margin-top: 6px; }
  #status { padding: 10px 14px 0; font-size: 13px; color: var(--muted); }
  #status.err { color: #ff6b6b; }
  main { padding: 12px 14px 24px; max-width: 1100px; }
  .board-section {
    margin-bottom: 22px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .board-head {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,.18);
  }
  .board-head h2 { margin: 0; font-size: 16px; font-weight: 800; }
  .board-head .count { font-size: 12px; color: var(--muted); font-weight: 700; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px; padding: 12px;
  }
  .card {
    background: #121820; border: 2px solid #3a4a62; border-radius: 10px;
    overflow: hidden;
  }
  .card .thumb {
    aspect-ratio: 1; background: #000; display: flex; align-items: center; justify-content: center;
  }
  .card img {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .card .cap {
    padding: 8px 9px 10px; border-top: 1px solid var(--line);
    font-size: 13px; font-weight: 800; text-align: center;
  }
  .card .sub {
    display: block; margin-top: 3px; font-size: 10px; font-weight: 600;
    color: var(--muted); word-break: break-all;
  }
  .empty {
    padding: 40px 14px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.5;
  }
  @media print {
    header { position: static; }
    a.btn, button { display: none; }
    .board-section { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <h1>Remove from Whatnot clone</h1>
  <p>
    Pins you <strong>tapped gone manually</strong> that may still appear when you clone Aug 10 inventory.
  Sold ledger pins are <strong>excluded</strong> — Whatnot already drops those from the clone.
  Search Whatnot for <strong>Board N Pin M</strong> and delete each listing below.
  </p>
  <div class="toolbar">
    <a class="btn" href="./index.html">← Mark gone</a>
    <button type="button" class="primary" id="btnRefresh">Refresh</button>
    <button type="button" id="btnPrint">Print</button>
  </div>
</header>
<div id="summary">Loading…</div>
<div id="status"></div>
<main id="main"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  const GONE_PATH = "showConfig/offerables15_inventory/goneStems";
  const CROP_BASE = "../crops/";
  const SOLD_JSON = "../sold-overlay/sold.json";
  const AUG10_LEDGER = "./ledgers/20260810_ledger.csv";
  const BOARD_PIN_RE = /Board\s+(\d+)\s+Pin\s+(\d+)/gi;

  const FB_CFG = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
    projectId: "fins-and-pins-click-to-claim",
  };

  firebase.initializeApp(FB_CFG);
  const db = firebase.database();

  let boardByImgStem = Object.create(null);
  /** @type {Set<string>} keys "board:pin" */
  let ledgerSold = new Set();

  function setStatus(msg, err) {
    const el = document.getElementById("status");
    el.textContent = msg || "";
    el.className = err ? "err" : "";
  }

  function bpKey(board, pin) {
    return `${board}:${pin}`;
  }

  function cropFile(stem) {
    const s = String(stem || "");
    return /\.jpe?g$/i.test(s) ? s : s + ".jpg";
  }

  function boardPinFromCrop(cropStem) {
    const m = String(cropStem || "").match(/^img(\d+)_pin0*(\d+)$/i);
    if (!m) return { board: null, pin: null, label: cropStem || "?" };
    const imgStem = `IMG_${m[1]}`;
    const board = boardByImgStem[imgStem];
    const pin = parseInt(m[2], 10);
    const label = board ? `Board ${board} Pin ${pin}` : `Pin ${pin} (${imgStem})`;
    return { board, pin, label };
  }

  function isManualGone(entry) {
    if (!entry || typeof entry !== "object") return false;
    const src = String(entry.source || "");
    if (src === "ledger" || src === "ledger_20260810" || src.startsWith("ledger")) return false;
    return src === "manual";
  }

  function isLedgerSold(board, pin) {
    return board != null && pin != null && ledgerSold.has(bpKey(board, pin));
  }

  function parseCsvLine(line) {
    const out = [];
    let cur = "";
    let q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) {
        if (c === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; }
          else q = false;
        } else cur += c;
      } else if (c === '"') q = true;
      else if (c === ",") { out.push(cur); cur = ""; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }

  function addBoardPinsFromText(text, minBoard) {
    let m;
    BOARD_PIN_RE.lastIndex = 0;
    while ((m = BOARD_PIN_RE.exec(text)) !== null) {
      const board = parseInt(m[1], 10);
      const pin = parseInt(m[2], 10);
      if (board >= minBoard) ledgerSold.add(bpKey(board, pin));
    }
  }

  async function loadLedgerSold() {
    ledgerSold = new Set();
    const sold = await fetch(`${SOLD_JSON}?v=2`, { cache: "no-store" }).then((r) => r.json());
    boardByImgStem = Object.create(null);
    (sold.boards || []).forEach((b) => {
      boardByImgStem[b.stem] = b.board;
      (b.sold || []).forEach((p) => {
        if (b.board != null && p.pin != null) ledgerSold.add(bpKey(b.board, p.pin));
      });
    });
    const thuCount = ledgerSold.size;

    try {
      const csvText = await fetch(`${AUG10_LEDGER}?v=1`, { cache: "no-store" }).then((r) => r.text());
      const lines = csvText.replace(/^\uFEFF/, "").split(/\r?\n/).filter((l) => l.trim());
      const headers = parseCsvLine(lines[0]);
      const cancelIdx = headers.findIndex((h) => /cancel/i.test(h));
      for (let i = 1; i < lines.length; i++) {
        const cells = parseCsvLine(lines[i]);
        if (cancelIdx >= 0 && cells[cancelIdx] && /cancel/i.test(cells[cancelIdx])) continue;
        addBoardPinsFromText(cells.join(" "), 48);
      }
    } catch (e) {
      console.warn("Aug 10 ledger CSV not loaded", e);
    }
    const total = ledgerSold.size;
    return { thuCount, aug10Added: total - thuCount, total };
  }

  function collectCloneRemovals(goneVal) {
    const allManual = [];
    const skippedLedger = [];
    for (const v of Object.values(goneVal || {})) {
      if (!isManualGone(v)) continue;
      const crop = v.crop_stem || "";
      const meta = boardPinFromCrop(crop);
      const board = v.board || meta.board;
      const pin = v.pin || meta.pin;
      const label = board && pin ? `Board ${board} Pin ${pin}` : meta.label;
      const item = {
        crop,
        board: board || 9999,
        pin: pin || 0,
        label,
        by: v.by || "",
        at: v.at || "",
      };
      if (isLedgerSold(board, pin)) {
        skippedLedger.push(item);
        continue;
      }
      allManual.push(item);
    }
    allManual.sort((a, b) => a.board - b.board || a.pin - b.pin);
    return { items: allManual, skippedLedger };
  }

  function groupByBoard(items) {
    const groups = [];
    let cur = null;
    items.forEach((item) => {
      const b = item.board === 9999 ? "?" : item.board;
      if (!cur || cur.board !== b) {
        cur = { board: b, items: [] };
        groups.push(cur);
      }
      cur.items.push(item);
    });
    return groups;
  }

  function render(result, ledgerMeta) {
    const { items, skippedLedger } = result;
    const summary = document.getElementById("summary");
    const main = document.getElementById("main");

    if (!items.length) {
      summary.innerHTML =
        "<strong>0</strong> pins to remove from clone." +
        (skippedLedger.length
          ? `<div class="skip">Skipped <strong>${skippedLedger.length}</strong> manual taps already sold per ledger (not cloneable).</div>`
          : "");
      main.innerHTML =
        '<div class="empty">Nothing to delete — either no manual gone marks, or they were all already sold on Whatnot.</div>';
      return;
    }

    const boards = new Set(items.map((i) => i.board).filter((b) => b !== 9999));
    summary.innerHTML =
      `<strong>${items.length}</strong> pins to remove from clone · ` +
      `<strong>${boards.size}</strong> boards` +
      (skippedLedger.length
        ? `<div class="skip">Skipped <strong>${skippedLedger.length}</strong> manual taps already in ledger sales (Aug 10 + Thursday) — Whatnot won’t clone those.</div>`
        : "") +
      `<div class="skip">Ledger refs loaded: Thursday <strong>${ledgerMeta.thuCount}</strong> · Aug 10 + <strong>${ledgerMeta.aug10Added}</strong> extra · <strong>${ledgerMeta.total}</strong> sold total</div>`;

    const groups = groupByBoard(items);
    main.innerHTML = "";
    groups.forEach((g) => {
      const sec = document.createElement("section");
      sec.className = "board-section";
      const title = g.board === "?" ? "Unknown board" : `Board ${g.board}`;
      sec.innerHTML =
        `<div class="board-head"><h2>${title}</h2>` +
        `<span class="count">${g.items.length} pin${g.items.length === 1 ? "" : "s"}</span></div>`;
      const grid = document.createElement("div");
      grid.className = "grid";
      g.items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          `<div class="thumb"><img loading="lazy" alt="" src="${CROP_BASE}${encodeURIComponent(cropFile(item.crop))}"></div>` +
          `<div class="cap">${item.label}` +
          (item.by ? `<span class="sub">by ${item.by}</span>` : "") +
          `</div>`;
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      main.appendChild(sec);
    });
  }

  let ledgerMeta = { thuCount: 0, aug10Added: 0, total: 0 };

  function refresh(goneVal) {
    const result = collectCloneRemovals(goneVal);
    render(result, ledgerMeta);
    setStatus(`Updated ${new Date().toLocaleString()} · manual gone minus ledger sales`);
  }

  document.getElementById("btnRefresh").addEventListener("click", () => {
    Promise.all([
      loadLedgerSold().then((m) => { ledgerMeta = m; }),
      db.ref(GONE_PATH).once("value"),
    ]).then(([, snap]) => refresh(snap.val() || {}));
  });
  document.getElementById("btnPrint").addEventListener("click", () => window.print());

  loadLedgerSold()
    .then((m) => {
      ledgerMeta = m;
      db.ref(GONE_PATH).on("value", (snap) => refresh(snap.val() || {}));
    })
    .catch((e) => {
      console.error(e);
      setStatus("Failed to load: " + e.message, true);
    });
})();
</script>
</body>
</html>
