.modal {

    if (o.not_a_pin) {
      nap_stems.push(pin.crop_stem);
      continue;
    }
    const c = finalCharacter(pin);
    if (c) character_map[pin.crop_stem] = c;
  }
  return {
    show_id: SHOW_ID,
    exported_at: new Date().toISOString(),
    character_map,
    nap_stems,
    counts: {
      character_map: Object.keys(character_map).length,
      nap: nap_stems.length,
    },
  };
}

async function syncToFirebase(opts) {
  const quiet = !!(opts && opts.quiet);
  if (!fbConfigured()) {
    if (!quiet) toast("Firebase not configured");
    return;
  }
  const payload = {
    show_id: SHOW_ID,
    kind: "offerables15_vlm_character_review",
    model: HARNESS_DATA.model || "",
    updated_at: new Date().toISOString(),
    reviewed_by: getReviewer(),
    overrides: encodeKeyedObject(state.overrides),
    export: buildExportPayload(),
  };
  await fbPut(FB_STATE_PATH, payload);
  persistQuiet();
  if (!quiet) {
    const n = Object.keys(state.overrides).filter(k => {
      const o = state.overrides[k];
      return o && (o.flagged || o.not_a_pin || o.fixed || (o.character != null && String(o.character).trim()));
    }).length;
    toast(`Synced to Firebase (${n} touched)`);
  }
}

async function loadFromFirebase() {
  if (!fbConfigured()) {
    toast("Firebase not configured");
    return;
  }
  const data = await fbGet(FB_STATE_PATH);
  if (!data || !data.overrides) {
    toast("No Firebase state yet for offerables15");
    return;
  }
  state.overrides = decodeKeyedObject(data.overrides || {});
  persistQuiet();
  render();
  toast("Loaded from Firebase");
}

document.getElementById("tabByChar").addEventListener("click", () => setView("byChar"));
document.getElementById("tabFlagged").addEventListener("click", () => setView("flagged"));
document.getElementById("tabNap").addEventListener("click", () => setView("nap"));
document.getElementById("search").addEventListener("input", (e) => {
  state.filter = e.target.value || "";
  render();
});
document.getElementById("btnSyncFb").addEventListener("click", () => {
  syncToFirebase({ quiet: false }).catch((e) => {
    console.error(e);
    toast(`Firebase sync failed: ${e && e.message ? e.message : e}`);
  });
});
document.getElementById("btnLoadFb").addEventListener("click", () => {
  loadFromFirebase().catch((e) => {
    console.error(e);
    toast(`Firebase load failed: ${e && e.message ? e.message : e}`);
  });
});
document.getElementById("btnDownload").addEventListener("click", () => {
  persistQuiet();
  const payload = {
    show_id: SHOW_ID,
    saved_at: new Date().toISOString(),
    overrides: state.overrides,
    ...buildExportPayload(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `offerables15_character_progress.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Downloaded progress JSON");
});
document.getElementById("btnExport").addEventListener("click", () => {
  const payload = buildExportPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `character_map_for_whatnot.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`Exported ${payload.counts.character_map} characters · ${payload.counts.nap} NaP`);
});

document.getElementById("modalClose").addEventListener("click", closeEditor);
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeEditor();
});
document.getElementById("modalAcceptVlm").addEventListener("click", () => {
  const pin = pinForStem(state.editing);
  if (!pin) return;
  document.getElementById("modalChar").value = pin.vlm_character || "";
});
document.getElementById("modalFlag").addEventListener("click", () => {
  const o = pinState(state.editing);
  o.flagged = !o.flagged;
  persistQuiet();
  closeEditor();
  render();
  toast(o.flagged ? "Flagged for later" : "Cleared flag");
});
document.getElementById("modalNap").addEventListener("click", () => {
  const o = pinState(state.editing);
  o.not_a_pin = true;
  o.flagged = false;
  o.character = null;
  persistQuiet();
  closeEditor();
  render();
  toast("Marked NaP — excluded from upload");
});
document.getElementById("modalClearNap").addEventListener("click", () => {
  const o = pinState(state.editing);
  o.not_a_pin = false;
  persistQuiet();
  toast("Cleared NaP");
});
document.getElementById("modalSave").addEventListener("click", () => {
  const o = pinState(state.editing);
  const val = document.getElementById("modalChar").value.trim();
  o.not_a_pin = false;
  o.character = val;
  o.fixed = true;
  o.flagged = false;
  persistQuiet();
  closeEditor();
  render();
  toast(val ? `Saved: ${val}` : "Cleared character");
});

state.fbReady = fbConfigured();
document.getElementById("btnSyncFb").disabled = !state.fbReady;
document.getElementById("btnLoadFb").disabled = !state.fbReady;

(async function boot() {
  let localOverrides = null;
  let localSavedAt = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.overrides) localOverrides = data.overrides;
      localSavedAt = data.saved_at || null;
      state.localSavedAt = localSavedAt;
    }
  } catch (_) {}

  let fbOverrides = null;
  let fbSavedAt = null;
  if (state.fbReady) {
    try {
      const data = await fbGet(FB_STATE_PATH);
      if (data && data.overrides) {
        fbOverrides = decodeKeyedObject(data.overrides);
        fbSavedAt = data.updated_at || null;
      }
    } catch (_) {}
  }

  const lt = localSavedAt ? Date.parse(localSavedAt) : 0;
  const ft = fbSavedAt ? Date.parse(fbSavedAt) : 0;
  if (localOverrides && fbOverrides) {
    state.overrides = (!ft || lt >= ft) ? localOverrides : fbOverrides;
  } else if (localOverrides) {
    state.overrides = localOverrides;
  } else if (fbOverrides) {
    state.overrides = fbOverrides;
  }
  setView("byChar");
})();
</script>
</body>
