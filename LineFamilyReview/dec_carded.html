const FIREBASE_ROOT = `lineFamilyReview/exclusions/${CLASS_KEY}`;

const firebaseConfig = {
  apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
  authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
  databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com",
  projectId: "fins-and-pins-click-to-claim",
  storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
  messagingSenderId: "31512845258",
  appId: "1:31512845258:web:2124fae24cfee229084d33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const exclRef = db.ref(FIREBASE_ROOT);

const grid = document.getElementById("grid");
const countEl = document.getElementById("count");
const statusEl = document.getElementById("status");
let excluded = {}; // id -> true

function updateCount() {
  const total = CANDIDATES.length;
  const nEx = Object.keys(excluded).length;
  countEl.textContent = `${nEx} excluded · ${total - nEx} remaining · ${total} total`;
}

function render() {
  grid.innerHTML = "";
  for (const c of CANDIDATES) {
    const isEx = !!excluded[c.id];
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card" + (isEx ? " excluded" : "");
    card.dataset.id = c.id;
    card.innerHTML = `
      <img src="${c.img}" alt="" loading="lazy" />
      <div class="meta">
        <div class="title">${escapeHtml(c.title || "")}</div>
        <div class="sub">${c.price != null ? "$" + c.price : ""} · ${(c.hits||[]).join(", ")} · ${c.match_status || ""}</div>
        <div class="badge">${isEx ? "EXCLUDED — tap to restore" : "tap to exclude"}</div>
      </div>`;
    card.addEventListener("click", () => toggle(c));
    grid.appendChild(card);
  }
  updateCount();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}

async function toggle(c) {
  const id = c.id;
  statusEl.textContent = "Saving…";
  try {
    if (excluded[id]) {
      await exclRef.child(id).remove();
    } else {
      await exclRef.child(id).set({
        excluded: true,
        title: c.title || "",
        pin_key: c.pin_key || "",
        source_id: c.source_id || "",
        ts: Date.now()
      });
    }
    statusEl.textContent = "Saved";
  } catch (e) {
    statusEl.textContent = "Save failed: " + (e && e.message ? e.message : e);
  }
}

exclRef.on("value", (snap) => {
  const val = snap.val() || {};
  excluded = {};
  for (const [id, row] of Object.entries(val)) {
    if (row && row.excluded !== false) excluded[id] = true;
  }
  render();
  statusEl.textContent = "Live sync on";
});
