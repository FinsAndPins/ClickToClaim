<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validation Report</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .match { color: green; font-weight: bold; }
        .no_match { color: red; font-weight: bold; }
        img { height: 60px; }
    </style>
</head>
<body>
    <h1>Photo Validation Results</h1>
    <button onclick="exportCSV()">Export Clean CSV for Whatnot</button>
    <div id="stats"></div>
    <table id="resultsTable">
        <thead>
            <tr>
                <th>Crop</th>
                <th>Status</th>
                <th>eBay Title</th>
                <th>Reviewer</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// (Insert SAME firebaseConfig from index.html here)
const firebaseConfig = { ... }; 

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const fbPath = "photo_validation/run_march_2026";

let items = {};
fetch("./pending_items.json").then(r => r.json()).then(data => {
    items = data;
    db.ref(fbPath).on("value", snap => render(snap.val() || {}));
});

function render(results) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    let matches = 0;

    Object.keys(results).forEach(safeKey => {
        const res = results[safeKey];
        const filename = res.orig_filename || safeKey;
        const item = items[filename] || {};
        
        if (res.status === 'match') matches++;

        const row = `<tr>
            <td><img src="${item.crop || ''}"></td>
            <td class="${res.status}">${res.status.toUpperCase()}</td>
            <td>${item.title || 'N/A'}</td>
            <td>${res.reviewer}</td>
        </tr>`;
        tbody.innerHTML += row;
    });
    document.getElementById("stats").textContent = `Matches: ${matches} | Total Reviewed: ${Object.keys(results).length}`;
}

function exportCSV() {
    // This generates a CSV of ONLY the 'match' items
    db.ref(fbPath).once("value", snap => {
        const results = snap.val() || {};
        let csv = "Title,Price,Filename\n";
        Object.keys(results).forEach(safeKey => {
            const res = results[safeKey];
            if (res.status === 'match') {
                const item = items[res.orig_filename] || {};
                csv += `"${item.title}",${item.price},${res.orig_filename}\n`;
            }
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'whatnot_ready_pins.csv');
        a.click();
    });
}
</script>
</body>
</html>
