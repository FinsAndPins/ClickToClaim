name = "finsandpins-intake"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Public hostname after DNS: sell.finsandpins.shop
# workers.dev URL works for private beta until then.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
APP_NAME = "Fins & Pins — Sell My Collection"
PUBLIC_BASE_URL = "http://127.0.0.1:8787"
FROM_EMAIL = "offer@finsandpins.shop"
STAFF_ALERT_EMAILS = "finsandpins@gmail.com"
STAFF_EMAILS = "steve.fierstein@gmail.com"
SHIP_TO_NAME = "Fins & Pins"
SHIP_TO_ADDRESS = "Set SHIP_TO_ADDRESS in Cloudflare / .dev.vars"
OFFER_TTL_DAYS = "7"
MAX_PHOTOS = "100"
MAX_PHOTO_BYTES = "15728640"
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "intake"
database_id = "00000000-0000-0000-0000-000000000001"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "finsandpins-intake"

[triggers]
crons = ["*/10 * * * *"]
