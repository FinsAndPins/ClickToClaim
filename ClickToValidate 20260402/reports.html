<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validation Reports – 20260402</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px; text-align: left; vertical-align: middle; }
        img { height: 70px; border-radius: 6px; }
        .status-match { color: #28a745; font-weight: bold; }
        .status-no_match { color: #dc3545; font-weight: bold; }
        .status-dont_know { color: #fd7e14; font-weight: bold; }
        .summary-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
        .summary-box { flex: 1; min-width: 120px; background: #f8f9fa; border-radius: 8px; padding: 15px; text-align: center; }
        .summary-box .number { font-size: 36px; font-weight: bold; }
        .summary-box .label { font-size: 13px; color: #666; margin-top: 4px; }
        .match-num { color: #28a745; }
        .nomatch-num { color: #dc3545; }
        .dontknow-num { color: #fd7e14; }
        .total-num { color: #007bff; }
        .remaining-num { color: #6c757d; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #0056b3; }
        .filter-bar { margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 14px; border: 2px solid #ccc; background: white; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .filter-btn.active { border-color: #007bff; background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h1 style="margin:0;">Validation Report – 20260402</h1>
        <button onclick="exportCSV()">⬇ Export Whatnot CSV (matches only)</button>
    </div>

    <div id="summary" class="summary-grid">
        <div class="summary-box"><div class="number total-num" id="cnt-total">–</div><div class="label">Validated</div></div>
        <div class="summary-box"><div class="number match-num" id="cnt-match">–</div><div class="label">MATCH ✓</div></div>
        <div class="summary-box"><div class="number nomatch-num" id="cnt-nomatch">–</div><div class="label">NO MATCH ✗</div></div>
        <div class="summary-box"><div class="number dontknow-num" id="cnt-dontknow">–</div><div class="label">DON'T KNOW ?</div></div>
        <div class="summary-box"><div class="number remaining-num" id="cnt-remaining">–</div><div class="label">Remaining</div></div>
    </div>
    <div id="progress-bar-wrap" style="margin-top:15px; background:#e9ecef; border-radius:8px; height:14px;">
        <div id="progress-bar" style="height:14px; border-radius:8px; background:#28a745; width:0%; transition:width 0.5s;"></div>
    </div>
</div>

<div class="card">
    <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all', this)">All validated</button>
        <button class="filter-btn" onclick="setFilter('match', this)">MATCH only</button>
        <button class="filter-btn" onclick="setFilter('no_match', this)">NO MATCH only</button>
        <button class="filter-btn" onclick="setFilter('dont_know', this)">DON'T KNOW only</button>
    </div>
    <table id="resultsTable">
        <thead>
            <tr><th>My Photo</th><th>eBay Match</th><th>Status</th><th>Reviewer</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyMsg" style="text-align:center; color:#999; padding:30px; display:none;">No results yet — validations will appear here as the team reviews.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const pathClean = window.location.pathname.replace(/\/reports\.html$/, "").replace(/\/$/, "");
const folderParts = pathClean.split("/");
const folderName = decodeURIComponent(folderParts.pop() || "default");
const fbName = folderName.replace(/\s+/g, "_").replace(/\./g, "_");
const fbPath = `photo_validation/${fbName}`;

let items = {};
let allResults = {};
let currentFilter = 'all';

fetch("./pending_items.json").then(r => r.json()).then(data => {
    items = data;
    db.ref(fbPath).on("value", snap => {
        allResults = snap.val() || {};
        render();
    });
});

function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
}

function render() {
    const tbody = document.getElementById("tableBody");
    const totalPins = Object.keys(items).length;
    let matches = 0, noMatches = 0, dontKnow = 0;

    const completed = Object.values(allResults).filter(r => r.status && r.status !== 'reviewing');
    completed.forEach(r => {
        if (r.status === 'match') matches++;
        else if (r.status === 'no_match') noMatches++;
        else if (r.status === 'dont_know') dontKnow++;
    });
    const totalValidated = matches + noMatches + dontKnow;
    const remaining = totalPins - totalValidated;
    const pct = totalPins > 0 ? Math.round(totalValidated / totalPins * 100) : 0;

    document.getElementById("cnt-total").textContent = totalValidated;
    document.getElementById("cnt-match").textContent = matches;
    document.getElementById("cnt-nomatch").textContent = noMatches;
    document.getElementById("cnt-dontknow").textContent = dontKnow;
    document.getElementById("cnt-remaining").textContent = remaining > 0 ? remaining : "Done!";
    document.getElementById("progress-bar").style.width = pct + "%";
    document.getElementById("progress-bar").title = pct + "% validated";

    const filtered = currentFilter === 'all' ? completed : completed.filter(r => r.status === currentFilter);

    tbody.innerHTML = "";
    if (filtered.length === 0) {
        document.getElementById("emptyMsg").style.display = "";
    } else {
        document.getElementById("emptyMsg").style.display = "none";
        filtered.sort((a, b) => (a.filename || "").localeCompare(b.filename || ""));
        filtered.forEach(res => {
            const fname = res.filename;
            const item = items[fname] || {};
            tbody.innerHTML += `<tr>
                <td><img src="${item.crop || ''}" onerror="this.style.display='none'" loading="lazy"></td>
                <td><img src="${item.thumb || ''}" onerror="this.style.display='none'" loading="lazy"><br><b>${res.title || item.title || 'Unknown'}</b><br><small style="color:#888">$${item.price || '?'}</small></td>
                <td class="status-${res.status}">${res.status.replace('_', ' ').toUpperCase()}</td>
                <td>${res.reviewer || '–'}</td>
            </tr>`;
        });
    }
}

function exportCSV() {
    db.ref(fbPath).once("value", snap => {
        const results = snap.val() || {};
        const matches = Object.values(results).filter(r => r.status === 'match');
        let csv = "Title,Price,Filename\n";
        matches.forEach(res => {
            const title = (res.title || items[res.filename]?.title || '').replace(/"/g, '""');
            const price = res.price || items[res.filename]?.price || 0;
            csv += `"${title}",${price},${res.filename}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'validated_pins_20260402.csv';
        a.click();
    });
}
</script>
</body>
</html>
