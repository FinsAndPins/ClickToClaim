<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Validator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #121212; color: white; overflow: hidden; touch-action: manipulation; }
        #topBar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #1e1e1e; border-bottom: 1px solid #333; height: 30px; }
        #displayArea { display: flex; gap: 10px; padding: 10px; height: 45vh; }
        .imgBox { flex: 1; background: #1e1e1e; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #333; overflow: hidden; }
        .imgBox img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 4px; font-size: 10px; color: #aaa; z-index: 2; }
        #titleBox { height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 15px; font-size: 18px; line-height: 1.3; font-weight: 500; }
        
        /* New Button Layout */
        #controls { display: flex; gap: 10px; padding: 10px; height: 130px; }
        button { border: none; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn-main { flex: 1.5; font-size: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-mid-col { display: flex; flex-direction: column; gap: 10px; flex: 0.8; }
        .btn-mid { flex: 1; font-size: 14px; background: #333; color: #bbb; display: flex; align-items: center; justify-content: center; gap: 5px; }
        #matchBtn { background: #28a745; }
        #noMatchBtn { background: #dc3545; }
        
        #loadingOverlay { position: fixed; inset: 0; background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; font-size: 18px; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #28a745; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText">Synchronizing Images...</div>
</div>

<div id="topBar">
    <div id="progress" style="color: #4cd964; font-weight: 600; font-size: 14px;">Loading...</div>
    <div id="userDisplay" style="color: #888; font-size: 14px;">@user</div>
</div>

<div id="displayArea">
    <div class="imgBox"><span class="badge">MY PHOTO</span><img id="cropImg"></div>
    <div class="imgBox"><span class="badge">EBAY MATCH</span><img id="thumbImg"></div>
</div>

<div id="titleBox">---</div>

<div id="controls">
    <button id="noMatchBtn" class="btn-main" onclick="submitResult('no_match')">❌ NO</button>
    <div class="btn-mid-col">
        <button id="backBtn" class="btn-mid" onclick="goBack()">← Back</button>
        <button id="skipBtn" class="btn-mid" onclick="skipPin()">⏭️ Skip</button>
    </div>
    <button id="matchBtn" class="btn-main" onclick="submitResult('match')">✅ MATCH</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const pathClean = window.location.pathname.replace(/\/index\.html$/, "").replace(/\/$/, "");
const folderName = decodeURIComponent(pathClean.split("/").pop() || "default");
const fbPath = `photo_validation/${folderName.replace(/\s+/g, "_").replace(/\./g, "_")}`;

let user = localStorage.getItem("validator_user") || prompt("Enter your @username:") || "@Guest";
if (!user.startsWith("@")) user = "@" + user;
localStorage.setItem("validator_user", user);
document.getElementById("userDisplay").textContent = user;

let items = {};
let itemKeys = [];
let validated = {};
let currentKey = null;

// Load Data
fetch("./pending_items.json").then(r => r.json()).then(data => {
    items = data;
    itemKeys = Object.keys(items);
    db.ref(fbPath).on("value", snap => {
        validated = snap.val() || {};
        loadNext();
    });
});

function loadNext() {
    // Find next pin: either one I'm already reviewing, or the first available one
    let nextKey = itemKeys.find(k => {
        const d = validated[k.replace(/\./g, "_")];
        return d && d.status === "reviewing" && d.reviewer === user;
    }) || itemKeys.find(k => !validated[k.replace(/\./g, "_")]);

    if (!nextKey) {
        document.body.innerHTML = "<div style='padding:50px; text-align:center;'><h2>All Done! 🎉</h2></div>";
        return;
    }

    if (nextKey === currentKey) return;
    currentKey = nextKey;
    const safeKey = currentKey.replace(/\./g, "_");

    // Lock the pin for this user
    db.ref(`${fbPath}/${safeKey}`).update({ status: "reviewing", reviewer: user });

    const item = items[currentKey];
    const cropImg = document.getElementById("cropImg");
    const thumbImg = document.getElementById("thumbImg");

    // UI Updates
    document.getElementById("loadingOverlay").style.display = "flex";
    document.getElementById("titleBox").textContent = item.title;
    
    let loaded = 0;
    const checkLoad = () => { if(++loaded >= 2) document.getElementById("loadingOverlay").style.display = "none"; };
    
    cropImg.onload = checkLoad;
    thumbImg.onload = checkLoad;
    cropImg.onerror = checkLoad; // Hide overlay even if image fails
    thumbImg.onerror = checkLoad;

    cropImg.src = item.crop;
    thumbImg.src = item.thumb;

    const doneCount = Object.values(validated).filter(v => v.status !== 'reviewing').length;
    document.getElementById("progress").textContent = `${doneCount} / ${itemKeys.length} Pins`;
}

function submitResult(status) {
    if (!currentKey) return;
    const safeKey = currentKey.replace(/\./g, "_");
    db.ref(`${fbPath}/${safeKey}`).set({
        status: status,
        reviewer: user,
        timestamp: Date.now(),
        filename: currentKey,
        title: items[currentKey].title,
        price: items[currentKey].price
    });
}

function skipPin() {
    if (!currentKey) return;
    // To skip and let others see it, we just remove the "reviewing" status
    db.ref(`${fbPath}/${currentKey.replace(/\./g, "_")}`).remove();
    currentKey = null; 
}

function goBack() {
    // Finds the last pin this user worked on and clears its status
    const myHistory = Object.entries(validated)
        .filter(([k, v]) => v.reviewer === user && v.status !== "reviewing")
        .sort((a, b) => b[1].timestamp - a[1].timestamp);

    if (myHistory.length > 0) {
        const lastKey = myHistory[0][0];
        db.ref(`${fbPath}/${lastKey}`).remove();
    }
}
</script>
</body>
</html>
