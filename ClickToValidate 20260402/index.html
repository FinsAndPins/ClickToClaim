<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Validator v4 – Team Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #121212; color: white; overflow: hidden; }
        #topBar { display: flex; justify-content: space-between; padding: 15px; background: #222; border-bottom: 1px solid #333; }
        #displayArea { height: 42vh; display: flex; gap: 10px; padding: 10px; visibility: hidden; }
        .imgBox { flex: 1; background: #2a2a2a; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #444; }
        .imgBox img { max-width: 98%; max-height: 98%; object-fit: contain; }
        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #aaa; }
        #titleBox { height: 80px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 20px; font-size: 22px; }
        #controls { display: flex; gap: 12px; padding: 15px; height: 120px; }
        button { border: none; border-radius: 16px; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.96); }
        .btn-main { flex: 1; height: 100%; font-size: 32px; }
        .btn-mid-col { display: flex; flex-direction: column; gap: 8px; flex: 0.5; height: 100%; }
        .btn-mid { flex: 1; font-size: 15px; background: #444; color: #ccc; }
        #matchBtn { background: #28a745; }
        #noMatchBtn { background: #dc3545; }
        #backBtn:disabled { opacity: 0.25; cursor: default; }
        #loadingOverlay { position: fixed; top: 70px; left: 0; right: 0; bottom: 250px; display: flex; align-items: center; justify-content: center; background: #121212; z-index: 5; font-size: 20px; }
        #doneScreen { position: fixed; inset: 0; background: #121212; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; }
    </style>
</head>
<body>

<div id="doneScreen">
    <h1 style="font-size: 80px; margin: 0;">🎉</h1>
    <h2 style="font-size: 36px; margin: 10px 0;">Congratulations!</h2>
    <p style="font-size: 24px; color: #28a745;">All the pins are done!</p>
    <p style="color: #888; margin-top: 20px;">You can close this tab and check the reports.</p>
</div>

<div id="topBar">
    <div id="progress" style="color: #28a745; font-weight: bold;">Syncing...</div>
    <div id="userDisplay">@user</div>
</div>

<div id="loadingOverlay">🚀 Synchronizing Images...</div>

<div id="displayArea">
    <div class="imgBox" onclick="retryCropImage()" title="Tap to reload if image is missing" style="cursor:pointer"><span class="badge">MY PHOTO</span><img id="cropImg"></div>
    <div class="imgBox"><span class="badge">EBAY MATCH</span><img id="thumbImg"></div>
</div>

<div id="titleBox">---</div>

<div id="controls">
    <button id="noMatchBtn" class="btn-main" onclick="submitResult('no_match')">❌ NO</button>
    <div class="btn-mid-col">
        <button id="backBtn" class="btn-mid" onclick="goBack()" disabled>← Back</button>
        <button id="unknownBtn" class="btn-mid" onclick="skipPin()">⏭️ Skip</button>
    </div>
    <button id="matchBtn" class="btn-main" onclick="submitResult('match')">✅ MATCH</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// DYNAMIC PATHING LOGIC
const pathClean = window.location.pathname.replace(/\/index\.html$/, "").replace(/\/$/, "");
const folderParts = pathClean.split("/");
const folderName = decodeURIComponent(folderParts.pop() || "default");
const fbName = folderName.replace(/\s+/g, "_").replace(/\./g, "_");
const fbPath = `photo_validation/${fbName}`;

let user = localStorage.getItem("validator_user") || prompt("Enter Name:") || "Guest";
if (!user.startsWith("@")) user = "@" + user;
localStorage.setItem("validator_user", user);
document.getElementById("userDisplay").textContent = user;

let items = {};
let itemKeys = [];
let validated = {};
let history = [];      // [{key}] — max 3
let currentKey = null; // track displayed pin so Firebase noise doesn't reload it
let localSkipped = new Set(); // pins skipped this session — not shown again until refresh

fetch("./pending_items.json").then(r => r.json()).then(data => {
    items = data;
    itemKeys = Object.keys(items);
    db.ref(fbPath).on("value", snap => {
        validated = snap.val() || {};
        loadNext();
    });
});

function loadNext() {
    let nextKey = itemKeys.find(k => {
        const d = validated[k.replace(/\./g, "_")];
        return d && d.status === "reviewing" && d.reviewer === user;
    }) || itemKeys.find(k => !validated[k.replace(/\./g, "_")] && !localSkipped.has(k));

    if (nextKey) {
        const safeKey = nextKey.replace(/\./g, "_");
        if (!validated[safeKey] || validated[safeKey].status !== "reviewing") {
            db.ref(`${fbPath}/${safeKey}`).update({ status: "reviewing", reviewer: user });
        }

        // Skip re-loading images if we're already showing this pin
        if (nextKey === currentKey) {
            const done = Object.values(validated).filter(v => v.status !== 'reviewing').length;
            document.getElementById("progress").textContent = `${done} / ${itemKeys.length} Pins`;
            return;
        }
        currentKey = nextKey;

        const item = items[nextKey];
        const display = document.getElementById("displayArea");
        const overlay = document.getElementById("loadingOverlay");
        display.style.visibility = "hidden";
        overlay.style.display = "flex";

        let loaded = 0;
        const img1 = new Image(); const img2 = new Image();
        const checkReady = () => {
            loaded++;
            if (loaded === 2) {
                document.getElementById("cropImg").src = img1.src;
                document.getElementById("thumbImg").src = img2.src;
                document.getElementById("titleBox").textContent = item.title;
                overlay.style.display = "none";
                display.style.visibility = "visible";
            }
        };
        img1.onload = checkReady;  img2.onload = checkReady;
        img1.onerror = checkReady; img2.onerror = checkReady;  // never get stuck on error
        img1.src = item.crop; img2.src = item.thumb;

        const done = Object.values(validated).filter(v => v.status !== 'reviewing').length;
        document.getElementById("progress").textContent = `${done} / ${itemKeys.length} Pins`;

        // Prefetch next few pins into browser cache (staggered to avoid imgbb rate limiting)
        prefetchAhead(nextKey);
    } else {
        document.getElementById("doneScreen").style.display = "flex";
    }
}

// Silently cache the next few pins so they load instantly when reached
function prefetchAhead(afterKey, count = 3) {
    const idx = itemKeys.indexOf(afterKey);
    if (idx === -1) return;
    let queued = 0;
    for (let i = idx + 1; i < itemKeys.length && queued < count; i++) {
        const k = itemKeys[i];
        const d = validated[k.replace(/\./g, "_")];
        if (d && d.status !== 'reviewing') continue;  // already done, skip
        if (localSkipped.has(k)) continue;
        const item = items[k];
        const delay = queued * 600;  // stagger: 0ms, 600ms, 1200ms
        setTimeout(() => {
            if (item.crop)  new Image().src = item.crop;
            if (item.thumb) new Image().src = item.thumb;
        }, delay);
        queued++;
    }
}

// Tap the left image to retry loading it fresh from imgbb
function retryCropImage() {
    if (!currentKey) return;
    const cropImg = document.getElementById("cropImg");
    cropImg.style.opacity = "0.4";
    const freshSrc = items[currentKey].crop + "?r=" + Date.now();
    const tmp = new Image();
    tmp.onload = tmp.onerror = () => {
        cropImg.src = freshSrc;
        cropImg.style.opacity = "1";
    };
    tmp.src = freshSrc;
}

function submitResult(status) {
    if (!currentKey) return;
    const safeKey = currentKey.replace(/\./g, "_");

    history.push({ key: currentKey });
    if (history.length > 3) history.shift();
    updateBackBtn();

    db.ref(`${fbPath}/${safeKey}`).set({
        status: status,
        reviewer: user,
        timestamp: Date.now(),
        filename: currentKey,
        title: items[currentKey].title,
        price: items[currentKey].price
    });
}

function skipPin() {
    if (!currentKey) return;
    const safeKey = currentKey.replace(/\./g, "_");
    // Put back in queue for others — remove Firebase entry
    db.ref(`${fbPath}/${safeKey}`).remove();
    // Don't show again this session
    localSkipped.add(currentKey);
    currentKey = null;
    loadNext();
}

function goBack() {
    if (history.length === 0) return;
    const last = history.pop();
    updateBackBtn();
    // Find and reset the current reviewing item
    const curKey = itemKeys.find(k => {
        const d = validated[k.replace(/\./g, "_")];
        return d && d.status === "reviewing" && d.reviewer === user;
    });
    if (curKey) db.ref(`${fbPath}/${curKey.replace(/\./g, "_")}`).remove();
    // Set previous item back to reviewing
    db.ref(`${fbPath}/${last.key.replace(/\./g, "_")}`).set({ status: "reviewing", reviewer: user });
}

function updateBackBtn() {
    document.getElementById('backBtn').disabled = history.length === 0;
}
</script>
</body>
</html>
