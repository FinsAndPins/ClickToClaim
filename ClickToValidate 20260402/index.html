<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Validator – GitHub Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #121212; color: white; overflow: hidden; }
        #topBar { display: flex; justify-content: space-between; padding: 10px 15px; background: #1e1e1e; border-bottom: 1px solid #333; height: 35px; align-items: center; }
        #displayArea { display: flex; gap: 10px; padding: 10px; height: 45vh; }
        .imgBox { flex: 1; background: #222; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #333; }
        .imgBox img { max-width: 95%; max-height: 95%; object-fit: contain; }
        .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; font-size: 10px; color: #aaa; }
        #titleBox { height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 15px; font-size: 18px; line-height: 1.2; }
        
        #controls { display: flex; gap: 10px; padding: 10px; height: 130px; }
        button { border: none; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; }
        .btn-main { flex: 2; font-size: 28px; }
        .btn-mid-col { display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .btn-mid { flex: 1; font-size: 14px; background: #333; color: #bbb; }
        #matchBtn { background: #28a745; }
        #noMatchBtn { background: #dc3545; }
    </style>
</head>
<body>

<div id="topBar">
    <div id="progress" style="color: #28a745; font-weight: bold;">0 / 0 Pins</div>
    <div id="userDisplay">@user</div>
</div>

<div id="displayArea">
    <div class="imgBox"><span class="badge">MY PHOTO</span><img id="cropImg"></div>
    <div class="imgBox"><span class="badge">EBAY MATCH</span><img id="thumbImg"></div>
</div>

<div id="titleBox">---</div>

<div id="controls">
    <button id="noMatchBtn" class="btn-main" onclick="submitResult('no_match')">❌ NO</button>
    <div class="btn-mid-col">
        <button id="backBtn" class="btn-mid" onclick="goBack()">← Back</button>
        <button id="skipBtn" class="btn-mid" onclick="skipPin()">Skip</button>
    </div>
    <button id="matchBtn" class="btn-main" onclick="submitResult('match')">✅ MATCH</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
// --- CONFIGURATION ---
const GITHUB_BASE = "https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/pins/";

const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const pathClean = window.location.pathname.replace(/\/index\.html$/, "").replace(/\/$/, "");
const folderName = decodeURIComponent(pathClean.split("/").pop() || "default");
const fbPath = `photo_validation/${folderName.replace(/\s+/g, "_").replace(/\./g, "_")}`;

let user = localStorage.getItem("validator_user") || prompt("Enter Name:") || "Guest";
if (!user.startsWith("@")) user = "@" + user;
localStorage.setItem("validator_user", user);
document.getElementById("userDisplay").textContent = user;

let items = {};
let itemKeys = [];
let validated = {};
let currentKey = null;

fetch("./pending_items.json").then(r => r.json()).then(data => {
    items = data;
    itemKeys = Object.keys(items);
    db.ref(fbPath).on("value", snap => {
        validated = snap.val() || {};
        loadNext();
    });
});

function loadNext() {
    let nextKey = itemKeys.find(k => {
        const d = validated[k.replace(/\./g, "_")];
        return d && d.status === "reviewing" && d.reviewer === user;
    }) || itemKeys.find(k => !validated[k.replace(/\./g, "_")]);

    if (!nextKey) {
        document.body.innerHTML = "<div style='padding:50px; text-align:center;'><h2>Session Complete! 🎉</h2></div>";
        return;
    }

    if (nextKey === currentKey) return;
    currentKey = nextKey;
    const safeKey = currentKey.replace(/\./g, "_");

    if (!validated[safeKey] || validated[safeKey].status !== "reviewing") {
        db.ref(`${fbPath}/${safeKey}`).update({ status: "reviewing", reviewer: user });
    }

    const item = items[currentKey];
    
    // Logic Change: Point to GitHub folder using the filename key
    document.getElementById("cropImg").src = GITHUB_BASE + currentKey;
    document.getElementById("thumbImg").src = item.thumb;
    document.getElementById("titleBox").textContent = item.title;

    const doneCount = Object.values(validated).filter(v => v.status !== 'reviewing').length;
    document.getElementById("progress").textContent = `${doneCount} / ${itemKeys.length} Pins`;
}

function submitResult(status) {
    if (!currentKey) return;
    const safeKey = currentKey.replace(/\./g, "_");
    db.ref(`${fbPath}/${safeKey}`).set({
        status: status,
        reviewer: user,
        timestamp: Date.now(),
        filename: currentKey,
        title: items[currentKey].title,
        price: items[currentKey].price
    });
}

function skipPin() {
    if (!currentKey) return;
    db.ref(`${fbPath}/${currentKey.replace(/\./g, "_")}`).remove();
    currentKey = null;
}

function goBack() {
    const myHistory = Object.entries(validated)
        .filter(([k, v]) => v.reviewer === user && v.status !== "reviewing")
        .sort((a, b) => b[1].timestamp - a[1].timestamp);

    if (myHistory.length > 0) {
        db.ref(`${fbPath}/${myHistory[0][0]}`).remove();
        currentKey = null;
    }
}
</script>
</body>
</html>
