<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClickToDescribe Reports – Fins & Pins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { font-size: 22px; margin-bottom: 5px; }
    #stats { color: #555; margin-bottom: 15px; font-size: 14px; }
    .btn { padding: 12px 20px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-right: 10px; margin-bottom: 15px; }
    .btn.red { background: #c0392b; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #eee; font-size: 12px; text-transform: uppercase; color: #666; }
    .original { color: #888; }
    .whatnot { font-weight: bold; color: #27ae60; }
    .mismatch { color: #e74c3c; font-weight: bold; }
    .price { color: #333; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>📋 ClickToDescribe Reports</h1>
  <div id="stats">Loading...</div>
  <button class="btn" onclick="exportWhatnotCSV()">⬇️ Export Whatnot CSV</button>
  <button class="btn" onclick="exportTrainingCSV()">⬇️ Export Training Data CSV</button>
  <table>
    <thead>
      <tr>
        <th>Original eBay Title</th>
        <th>AI Suggested Title</th>
        <th>Final Whatnot Title</th>
        <th>Edited?</th>
        <th>Price</th>
        <th>Reviewer</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
  authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
  databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
  projectId: "fins-and-pins-click-to-claim",
  storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
  messagingSenderId: "31512845258",
  appId: "1:31512845258:web:2124fae24cfee229084d33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const pathClean = window.location.pathname.replace(/\/reports\.html$/, "").replace(/\/$/, "");
const fbName = pathClean.split("/").pop() || "default";
const fbPath = `description_training/${fbName}`;

let allData = {};
let pendingItems = {};

// Load pending_items to get ibb URLs
fetch("./pending_items.json").then(r => r.json()).then(d => { pendingItems = d; });

db.ref(fbPath).on("value", snap => {
  allData = snap.val() || {};
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  let described = 0, mismatches = 0, reviewing = 0;

  Object.values(allData).forEach(res => {
    if (res.status === "reviewing") { reviewing++; return; }
    if (res.status === "described") described++;
    if (res.status === "mismatch") mismatches++;

    const row = document.createElement("tr");
    const editedFlag = res.was_edited ? "✏️ Yes" : "—";
    row.innerHTML = `
      <td class="original">${res.original_title || ""}</td>
      <td class="original" style="color:#f39c12">${res.ai_title || ""}</td>
      <td class="${res.status === 'mismatch' ? 'mismatch' : 'whatnot'}">${res.whatnot_title || ""}</td>
      <td style="text-align:center">${editedFlag}</td>
      <td class="price">$${res.price || ""}</td>
      <td>${res.reviewer || ""}</td>
    `;
    tbody.appendChild(row);
  });

  const total = Object.keys(allData).length;
  document.getElementById("stats").textContent =
    `${described} described · ${mismatches} mismatches · ${reviewing} in progress · ${total} total`;
});

function escapeCSV(v) {
  if (v === null || v === undefined) return "";
  return `"${String(v).replace(/"/g, '""')}"`;
}

function exportWhatnotCSV() {
  const headers = ["Category","Sub Category","Title","Description","Quantity","Type","Price",
    "Shipping Profile","Offerable","Hazmat","Condition","Cost Per Item","SKU",
    "Image URL 1","Image URL 2","Image URL 3","Image URL 4",
    "Image URL 5","Image URL 6","Image URL 7","Image URL 8"];

  let rows = [headers.join(",")];

  Object.values(allData).forEach(res => {
    if (res.status !== "described") return;
    const ibbUrl = (pendingItems[res.filename] || {}).crop || "";
    const sku = res.filename ? res.filename.replace("IMG_", "").replace("_pin_", "-").replace(".jpg","") : "";
    const desc = `Please rely on the photo, rather than the description. ${res.whatnot_title || ""}`;
    const row = [
      "Disneyana", "Disney Pins",
      escapeCSV(res.whatnot_title),
      escapeCSV(desc),
      "1", "Buy it Now",
      res.price || "",
      "0-1 oz", "TRUE", "Not Hazmat", "Used", "",
      escapeCSV(sku),
      escapeCSV(ibbUrl),
      "","","","","","",""
    ];
    rows.push(row.join(","));
  });

  downloadCSV(rows.join("\n"), `whatnot_described_${fbName}.csv`);
}

function exportTrainingCSV() {
  const headers = ["Filename","Status","Original eBay Title","AI Suggested Title","Final Whatnot Title","Was Edited","Original Price","Final Price","Reviewer","Timestamp"];
  let rows = [headers.join(",")];
  Object.values(allData).forEach(r => {
    if (r.status === "reviewing") return;
    const origPrice = (pendingItems[r.filename] || {}).price || "";
    const ts = r.timestamp ? new Date(r.timestamp).toISOString() : "";
    rows.push([
      escapeCSV(r.filename),
      escapeCSV(r.status),
      escapeCSV(r.original_title),
      escapeCSV(r.ai_title || ""),
      escapeCSV(r.whatnot_title),
      r.was_edited ? "YES" : "NO",
      origPrice,
      r.price || "",
      escapeCSV(r.reviewer),
      escapeCSV(ts)
    ].join(","));
  });
  downloadCSV(rows.join("\n"), `training_data_${fbName}.csv`);
}

function downloadCSV(content, filename) {
  const blob = new Blob([content], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
</script>
</body>
</html>
