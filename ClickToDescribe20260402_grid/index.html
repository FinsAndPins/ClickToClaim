<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClickToDescribe Grid - 20260402</title>
  <style>
    * { box-sizing: border-box; }
    :root { --tile-scale: 1; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
    }
    #app {
      padding: 14px;
      max-width: none;
      margin: 0 auto;
    }
    #topBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      background: #181818;
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    #controls label { color: #9d9d9d; font-size: 12px; }
    #controls select, #controls input[type="range"] {
      background: #121212;
      color: #dcdcdc;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
    }
    #stats { color: #9f9f9f; font-size: 14px; }
    #reviewerDisplay { color: #6fbf7a; font-size: 14px; font-weight: 600; }
    #grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: calc(10px * var(--tile-scale));
      min-width: 1680px;
      grid-auto-rows: min-content;
    }
    .card {
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 8px;
      min-height: calc(275px * var(--tile-scale));
      display: flex;
      flex-direction: column;
      gap: calc(8px * var(--tile-scale));
    }
    .photoWrap {
      position: relative;
      width: 100%;
      height: calc(170px * var(--tile-scale));
      border-radius: 10px;
      overflow: hidden;
      background: #222;
      border: 1px solid #2f2f2f;
      cursor: pointer;
    }
    .photoWrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .charEdit {
      position: absolute;
      left: calc(6px * var(--tile-scale));
      top: calc(6px * var(--tile-scale));
      width: min(72%, calc(210px * var(--tile-scale)));
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: calc(5px * var(--tile-scale)) calc(8px * var(--tile-scale));
      color: #7dff92;
      font-size: calc(12px * var(--tile-scale));
      line-height: 1.2;
      font-weight: 700;
      outline: none;
    }
    .row {
      margin-top: auto;
      display: flex;
      gap: calc(6px * var(--tile-scale));
    }
    .btn {
      flex: 1;
      border: none;
      border-radius: 9px;
      padding: calc(10px * var(--tile-scale)) calc(8px * var(--tile-scale));
      font-size: calc(13px * var(--tile-scale));
      font-weight: 700;
      cursor: pointer;
    }
    .btnSkip {
      background: #2a2a2a;
      color: #b9b9b9;
      border: 1px solid #393939;
    }
    .note { color: #7f7f7f; font-size: 12px; margin-top: 10px; }
    .emptyMsg { color: #9a9a9a; font-size: 13px; }
    #reviewerModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 20;
    }
    .modalBox {
      background: #1d1d1d;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 18px;
      width: 100%;
      max-width: 420px;
    }
    .modalBox h3 { margin: 0 0 6px; }
    .modalBox p { margin: 0 0 10px; color: #9a9a9a; }
    .modalBox input {
      width: 100%;
      background: #131313;
      color: #fff;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 12px;
      font-size: 17px;
      margin-bottom: 10px;
    }
    .modalBox button {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #27ae60;
      color: #fff;
      font-weight: 700;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }
    @media (max-width: 1740px) { body { overflow-x: auto; } }
  </style>
</head>
<body>
  <div id="reviewerModal" style="display:none;">
    <div class="modalBox">
      <h3>Grid Reviewer</h3>
      <p>Production mode. Enter your handle.</p>
      <input id="reviewerInput" type="text" placeholder="@YourHandle" autocomplete="off">
      <button id="reviewerSaveBtn">Start Grid Review</button>
    </div>
  </div>

  <div id="app">
    <div id="topBar">
      <div id="stats">Loading…</div>
      <div id="controls">
        <label for="colsSelect">Across</label>
        <select id="colsSelect">
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6" selected>6</option>
        </select>
        <label for="rowsSelect">Down</label>
        <select id="rowsSelect">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
        <label for="sizeRange">Size</label>
        <input id="sizeRange" type="range" min="80" max="125" step="5" value="100">
      </div>
      <div id="reviewerDisplay"></div>
    </div>
    <div id="grid"></div>
    <div class="note">Writes to production `ClickToDescribe20260402`. Tap photo to confirm. Skip keeps pin in queue.</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
      authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
      databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
      projectId: "fins-and-pins-click-to-claim",
      storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
      messagingSenderId: "31512845258",
      appId: "1:31512845258:web:2124fae24cfee229084d33"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const SOURCE_PATH = "description_review/ClickToDescribe20260402";
    const WRITE_PATH = SOURCE_PATH;
    const PENDING_URL = "../ClickToDescribe20260402/pending_items.json";
    const PINS_BASE = "https://finsandpins.github.io/ClickToClaim/ClickToValidate%2020260402/pins/";
    const LS_REVIEWER = "fp_reviewer_describe_grid_prod_v1";
    const viewState = { cols: 6, rows: 2, scale: 1 };

    let reviewer = "";
    let allPins = {};
    let queue = [];
    let pointer = 0;
    let sessionConfirmed = 0;
    let totalConfirmed = 0;
    let savedMap = {};

    function visibleSlots() { return viewState.cols * viewState.rows; }
    function sanitizeKey(filename) { return String(filename || "").replace(/\./g, "_"); }
    function cleanTitle(t) {
      if (!t) return "";
      return String(t)
        .replace(/\b(new\s+in\s+package|NIP|various)\b/gi, "")
        .replace(/\bLE\s*[/]?\s*\d+\b/g, "LE")
        .replace(/\bLimited\s+Edition\s+(?:of\s+)?\d+\b/gi, "Limited Edition")
        .replace(/\s{2,}/g, " ")
        .replace(/^[\s,\-–]+|[\s,\-–]+$/g, "")
        .trim();
    }

    function applyGridLayout() {
      const grid = document.getElementById("grid");
      grid.style.gridTemplateColumns = `repeat(${viewState.cols}, minmax(0, 1fr))`;
      grid.style.minWidth = `${Math.round(viewState.cols * 260 * viewState.scale)}px`;
      document.documentElement.style.setProperty("--tile-scale", String(viewState.scale));
    }

    function getVisibleFilenamesFromDom() {
      return Array.from(document.querySelectorAll("#grid .card[data-filename]")).map((el) => el.dataset.filename);
    }

    function rerenderForViewChange() {
      const currentVisible = getVisibleFilenamesFromDom();
      const desired = visibleSlots();
      let keep = currentVisible.slice(0, desired);
      const removed = currentVisible.slice(desired);
      if (removed.length) pointer = Math.max(0, pointer - removed.length);
      while (keep.length < desired && pointer < queue.length) {
        keep.push(queue[pointer]);
        pointer += 1;
      }
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for (const filename of keep) grid.appendChild(createCard(filename));
      if (!grid.children.length) renderDoneCards();
      updateStats();
    }

    function initControls() {
      const colsEl = document.getElementById("colsSelect");
      const rowsEl = document.getElementById("rowsSelect");
      const sizeEl = document.getElementById("sizeRange");
      colsEl.value = String(viewState.cols);
      rowsEl.value = String(viewState.rows);
      sizeEl.value = String(Math.round(viewState.scale * 100));

      colsEl.addEventListener("change", () => {
        viewState.cols = Math.max(1, parseInt(colsEl.value || "6", 10));
        applyGridLayout();
        rerenderForViewChange();
      });
      rowsEl.addEventListener("change", () => {
        viewState.rows = Math.max(1, parseInt(rowsEl.value || "2", 10));
        applyGridLayout();
        rerenderForViewChange();
      });
      sizeEl.addEventListener("input", () => {
        viewState.scale = Math.max(0.8, Math.min(1.25, parseInt(sizeEl.value || "100", 10) / 100));
        applyGridLayout();
      });
      applyGridLayout();
    }

    function startWithReviewer() {
      const saved = localStorage.getItem(LS_REVIEWER);
      if (saved) {
        reviewer = saved;
        document.getElementById("reviewerDisplay").textContent = reviewer;
        init();
      } else {
        document.getElementById("reviewerModal").style.display = "flex";
        document.getElementById("reviewerInput").focus();
      }
    }

    document.getElementById("reviewerSaveBtn").addEventListener("click", () => {
      const val = document.getElementById("reviewerInput").value.trim();
      if (!val) return;
      reviewer = val.startsWith("@") ? val : `@${val}`;
      localStorage.setItem(LS_REVIEWER, reviewer);
      document.getElementById("reviewerModal").style.display = "none";
      document.getElementById("reviewerDisplay").textContent = reviewer;
      init();
    });
    document.getElementById("reviewerInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("reviewerSaveBtn").click();
    });

    async function init() {
      try {
        document.getElementById("stats").textContent = "Loading pending pins…";
        const pendingRes = await fetch(PENDING_URL);
        allPins = await pendingRes.json();

        document.getElementById("stats").textContent = "Loading existing production progress…";
        const sourceSnap = await db.ref(SOURCE_PATH).get();
        savedMap = sourceSnap.exists() ? sourceSnap.val() : {};

        const allKeys = Object.keys(allPins);
        queue = allKeys.filter((filename) => !savedMap[sanitizeKey(filename)]);
        pointer = 0;
        totalConfirmed = Object.keys(savedMap).length;

        if (!queue.length) {
          document.getElementById("stats").textContent = `Done. ${totalConfirmed} already confirmed in ClickToDescribe20260402.`;
          renderDoneCards();
          return;
        }
        renderGrid();
        updateStats();
      } catch (e) {
        document.getElementById("stats").textContent = `Load error: ${e.message}`;
      }
    }

    function updateStats() {
      const total = Object.keys(allPins).length;
      const remaining = Math.max(0, queue.length - pointer);
      document.getElementById("stats").textContent =
        `Grid: ${visibleSlots()} cards (${viewState.cols}x${viewState.rows}) | Remaining: ${remaining} | Confirmed in prod: ${totalConfirmed} | Session: ${sessionConfirmed} | Total set: ${total}`;
    }

    function getDisplayCharacter(filename) {
      const key = sanitizeKey(filename);
      const pin = allPins[filename] || {};
      const fromSaved = savedMap[key] && savedMap[key].final_title ? savedMap[key].final_title : "";
      const fromPending = pin.final_character || pin.title_character || "Unknown";
      return cleanTitle(fromSaved || fromPending);
    }

    function createCard(filename) {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.filename = filename;

      const photoWrap = document.createElement("div");
      photoWrap.className = "photoWrap";
      const img = document.createElement("img");
      img.alt = filename;
      img.src = `${PINS_BASE}${encodeURIComponent(filename)}`;
      img.onerror = () => {
        const pin = allPins[filename] || {};
        img.src = pin.crop || pin.thumb || "";
      };
      photoWrap.appendChild(img);

      const charInput = document.createElement("input");
      charInput.type = "text";
      charInput.className = "charEdit";
      charInput.value = getDisplayCharacter(filename) || "Unknown";
      photoWrap.appendChild(charInput);
      img.addEventListener("click", () => handleConfirm(card, filename, charInput));

      const row = document.createElement("div");
      row.className = "row";
      const skip = document.createElement("button");
      skip.className = "btn btnSkip";
      skip.textContent = "Skip for later";
      skip.addEventListener("click", () => handleSkip(card, filename));
      row.appendChild(skip);

      card.appendChild(photoWrap);
      card.appendChild(row);
      return card;
    }

    async function handleConfirm(card, filename, charInput) {
      const finalTitle = cleanTitle((charInput && charInput.value) || "");
      if (!finalTitle) return;
      const baseTitle = getDisplayCharacter(filename);
      const key = sanitizeKey(filename);
      const payload = {
        filename,
        ai_title: baseTitle,
        final_title: finalTitle,
        was_edited: finalTitle !== baseTitle,
        reviewer,
        timestamp: Date.now(),
        status: "confirmed",
        source: "grid_prod_v1"
      };
      card.style.opacity = "0.55";
      card.style.pointerEvents = "none";
      try {
        await db.ref(`${WRITE_PATH}/${key}`).update(payload);
        savedMap[key] = payload;
        totalConfirmed += 1;
        sessionConfirmed += 1;
        replaceCardWithNext(card);
        updateStats();
      } catch (e) {
        card.style.opacity = "";
        card.style.pointerEvents = "";
        alert(`Save failed: ${e.message}`);
      }
    }

    function handleSkip(card, filename) {
      queue.push(filename);
      replaceCardWithNext(card);
      updateStats();
    }

    function replaceCardWithNext(card) {
      if (pointer >= queue.length) {
        card.innerHTML = "<div class='emptyMsg'>No more pins in queue.</div>";
        return;
      }
      const filename = queue[pointer];
      pointer += 1;
      card.replaceWith(createCard(filename));
    }

    function renderGrid() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      for (let i = 0; i < visibleSlots(); i++) {
        if (pointer >= queue.length) break;
        const filename = queue[pointer];
        pointer += 1;
        grid.appendChild(createCard(filename));
      }
      if (!grid.children.length) renderDoneCards();
    }

    function renderDoneCards() {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      const done = document.createElement("div");
      done.className = "card";
      done.style.maxWidth = "460px";
      done.innerHTML = "<h3 style='margin:0;'>All done in production queue</h3><p style='color:#9a9a9a;'>Everything appears confirmed already.</p>";
      grid.appendChild(done);
    }

    initControls();
    startWithReviewer();
  </script>
</body>
</html>
