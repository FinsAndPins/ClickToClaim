<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Board Box Editor — 20260810</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1c2030;
      --text: #f4f6fb;
      --muted: #9aa3b5;
      --accent: #00e5a8;
      --accent2: #ff3d81;
      --box: #00ff9c;
      --box-sel: #ffea00;
      --handle: #ffffff;
      --danger: #ff4d4d;
      --ok: #3ddc97;
      --btn: #2a3148;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Avenir Next", "Segoe UI", sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
    header {
      flex: 0 0 auto;
      background: var(--panel);
      padding: 8px 10px calc(8px + env(safe-area-inset-top));
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column; gap: 8px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .title { font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
    .meta { font-size: 12px; color: var(--muted); }
    .meta strong { color: var(--accent); }
    #status { font-size: 12px; color: var(--muted); min-height: 16px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--danger); }
    select, button {
      font: inherit; font-size: 13px; font-weight: 700;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.14);
      background: var(--btn); color: var(--text);
      padding: 10px 12px; min-height: 42px; cursor: pointer;
    }
    select { flex: 1 1 160px; min-width: 140px; }
    button:active { transform: scale(0.98); }
    button.primary { background: #0b6e4f; border-color: var(--accent); color: #fff; }
    button.danger { background: #5a1520; border-color: var(--danger); }
    button:disabled { opacity: 0.45; cursor: default; }
    #stageWrap {
      flex: 1 1 auto; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
      background: #0a0c12; position: relative;
      padding: 10px;
    }
    #stage {
      position: relative; margin: 0 auto; width: fit-content;
      touch-action: none; user-select: none;
    }
    #boardImg {
      display: block; max-width: min(100vw - 20px, 960px);
      width: auto; height: auto;
      border-radius: 6px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
    }
    #overlay {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .box {
      position: absolute; pointer-events: auto;
      border: 3px solid var(--box);
      background: rgba(0, 255, 156, 0.18);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(0,0,0,0.25);
      cursor: move;
    }
    .box.selected {
      border-color: var(--box-sel);
      background: rgba(255, 234, 0, 0.22);
      z-index: 5;
    }
    .box .tag {
      position: absolute; left: 0; top: 0; transform: translateY(-100%);
      background: rgba(0,0,0,0.82); color: #fff;
      font-size: 11px; font-weight: 800; padding: 2px 6px;
      border-radius: 4px 4px 0 0; white-space: nowrap;
      pointer-events: none;
    }
    .box.selected .tag { background: var(--box-sel); color: #111; }
    .handle {
      position: absolute; width: 22px; height: 22px;
      background: var(--handle); border: 2px solid #111;
      border-radius: 4px; pointer-events: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .handle.nw { left: -11px; top: -11px; cursor: nwse-resize; }
    .handle.ne { right: -11px; top: -11px; cursor: nesw-resize; }
    .handle.sw { left: -11px; bottom: -11px; cursor: nesw-resize; }
    .handle.se { right: -11px; bottom: -11px; cursor: nwse-resize; }
    .hint {
      font-size: 11px; color: var(--muted); line-height: 1.35;
      padding: 0 2px 4px;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <div class="title">Board Box Editor</div>
      <div class="meta">20260810 · <strong id="pinCount">0</strong> pins · board <strong id="boardIdx">1</strong>/<span id="boardTotal">0</span></div>
    </div>
    <div class="row">
      <button type="button" id="btnPrev" title="Previous board">◀ Prev</button>
      <select id="boardSelect" aria-label="Board"></select>
      <button type="button" id="btnNext" title="Next board">Next ▶</button>
    </div>
    <div class="row">
      <button type="button" id="btnAdd">＋ Add</button>
      <button type="button" id="btnDelete" class="danger">Delete</button>
      <button type="button" id="btnUndo">Undo</button>
      <button type="button" id="btnSave" class="primary">Save</button>
      <button type="button" id="btnDownload">Download JSON</button>
      <button type="button" id="btnReset">Reload file</button>
    </div>
    <div id="status">Loading…</div>
    <div class="hint">Bright green boxes = pins. Tap a box, drag to move, drag yellow-selected corner squares to resize. <strong>Save</strong> writes to Firebase (syncs iPhone/iPad/Mac) and renumbers pin IDs in reading order. Download keeps a local backup.</div>
  </header>
  <div id="stageWrap">
    <div id="stage">
      <img id="boardImg" alt="Board">
      <div id="overlay"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  const SHOW_SLUG = "20260810";
  const FIREBASE_ROOT = `boardBoxEditor/${SHOW_SLUG}`;
  const MIN_BOX = 24;

  const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const el = {
    select: document.getElementById("boardSelect"),
    img: document.getElementById("boardImg"),
    overlay: document.getElementById("overlay"),
    stage: document.getElementById("stage"),
    status: document.getElementById("status"),
    pinCount: document.getElementById("pinCount"),
    boardIdx: document.getElementById("boardIdx"),
    boardTotal: document.getElementById("boardTotal"),
    btnPrev: document.getElementById("btnPrev"),
    btnNext: document.getElementById("btnNext"),
    btnAdd: document.getElementById("btnAdd"),
    btnDelete: document.getElementById("btnDelete"),
    btnUndo: document.getElementById("btnUndo"),
    btnSave: document.getElementById("btnSave"),
    btnDownload: document.getElementById("btnDownload"),
    btnReset: document.getElementById("btnReset"),
  };

  let stems = [];
  let stemIndex = 0;
  let filePayload = null;      // baseline from boards/*.json
  let predictions = [];        // working copy (center x/y + w/h in image pixels)
  let imageMeta = { width: 0, height: 0 };
  let selected = -1;
  let dirty = false;
  let undoStack = [];
  let displayScale = 1;
  let drag = null;
  let suppressFirebaseEcho = false;

  function setStatus(msg, kind) {
    el.status.textContent = msg || "";
    el.status.className = kind || "";
  }

  function boardNumericId(stem) {
    const matches = String(stem).match(/\d+/g);
    if (!matches || !matches.length) return "0000";
    return matches.reduce((a, b) => (b.length > a.length ? b : a));
  }

  function clonePreds(list) {
    return JSON.parse(JSON.stringify(list || []));
  }

  function pushUndo() {
    undoStack.push(clonePreds(predictions));
    if (undoStack.length > 60) undoStack.shift();
    el.btnUndo.disabled = false;
  }

  function markDirty() {
    dirty = true;
    setStatus(`Unsaved edits on ${stems[stemIndex]}`, "");
  }

  function renumber(preds, stem) {
    const num = boardNumericId(stem);
    const sorted = [...preds].sort((a, b) => (a.y - b.y) || (a.x - b.x));
    sorted.forEach((p, i) => {
      p.crop_stem = `img${num}_pin${String(i + 1).padStart(2, "0")}`;
      if (!p.class) p.class = "pin";
      if (p.confidence == null) p.confidence = 1;
    });
    return sorted;
  }

  function updateScale() {
    const nw = el.img.naturalWidth || imageMeta.width || 1;
    const dw = el.img.clientWidth || nw;
    displayScale = dw / nw;
  }

  function centerToCss(p) {
    const left = (p.x - p.width / 2) * displayScale;
    const top = (p.y - p.height / 2) * displayScale;
    const w = p.width * displayScale;
    const h = p.height * displayScale;
    return { left, top, w, h };
  }

  function render() {
    updateScale();
    el.overlay.innerHTML = "";
    el.overlay.style.width = el.img.clientWidth + "px";
    el.overlay.style.height = el.img.clientHeight + "px";
    predictions.forEach((p, idx) => {
      const { left, top, w, h } = centerToCss(p);
      const box = document.createElement("div");
      box.className = "box" + (idx === selected ? " selected" : "");
      box.style.left = left + "px";
      box.style.top = top + "px";
      box.style.width = w + "px";
      box.style.height = h + "px";
      box.dataset.idx = String(idx);
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = `${idx + 1} · ${p.crop_stem || ""}`;
      box.appendChild(tag);
      if (idx === selected) {
        ["nw", "ne", "sw", "se"].forEach((corner) => {
          const hEl = document.createElement("div");
          hEl.className = "handle " + corner;
          hEl.dataset.corner = corner;
          box.appendChild(hEl);
        });
      }
      el.overlay.appendChild(box);
    });
    el.pinCount.textContent = String(predictions.length);
    el.boardIdx.textContent = String(stemIndex + 1);
    el.boardTotal.textContent = String(stems.length);
    el.btnDelete.disabled = selected < 0;
    el.btnUndo.disabled = undoStack.length === 0;
  }

  function pointerPos(e) {
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    const rect = el.overlay.getBoundingClientRect();
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function clampPred(p) {
    const W = imageMeta.width || el.img.naturalWidth;
    const H = imageMeta.height || el.img.naturalHeight;
    p.width = Math.max(MIN_BOX, Math.min(p.width, W));
    p.height = Math.max(MIN_BOX, Math.min(p.height, H));
    const halfW = p.width / 2;
    const halfH = p.height / 2;
    p.x = Math.max(halfW, Math.min(W - halfW, p.x));
    p.y = Math.max(halfH, Math.min(H - halfH, p.y));
  }

  el.overlay.addEventListener("pointerdown", (e) => {
    const target = e.target;
    if (!(target instanceof Element)) return;
    const box = target.closest(".box");
    if (!box) {
      selected = -1;
      render();
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    const idx = Number(box.dataset.idx);
    selected = idx;
    const corner = target.classList.contains("handle") ? target.dataset.corner : null;
    const pos = pointerPos(e);
    const p = predictions[idx];
    pushUndo();
    drag = {
      idx,
      corner,
      startX: pos.x,
      startY: pos.y,
      orig: { x: p.x, y: p.y, width: p.width, height: p.height }
    };
    try { el.overlay.setPointerCapture(e.pointerId); } catch (_) {}
    render();
  });

  function onPointerMove(e) {
    if (!drag) return;
    e.preventDefault();
    const pos = pointerPos(e);
    const dx = (pos.x - drag.startX) / displayScale;
    const dy = (pos.y - drag.startY) / displayScale;
    const p = predictions[drag.idx];
    const o = drag.orig;
    if (!drag.corner) {
      p.x = o.x + dx;
      p.y = o.y + dy;
    } else {
      let left = o.x - o.width / 2;
      let right = o.x + o.width / 2;
      let top = o.y - o.height / 2;
      let bottom = o.y + o.height / 2;
      if (drag.corner.includes("w")) left = o.x - o.width / 2 + dx;
      if (drag.corner.includes("e")) right = o.x + o.width / 2 + dx;
      if (drag.corner.includes("n")) top = o.y - o.height / 2 + dy;
      if (drag.corner.includes("s")) bottom = o.y + o.height / 2 + dy;
      if (right - left < MIN_BOX) {
        if (drag.corner.includes("w")) left = right - MIN_BOX;
        else right = left + MIN_BOX;
      }
      if (bottom - top < MIN_BOX) {
        if (drag.corner.includes("n")) top = bottom - MIN_BOX;
        else bottom = top + MIN_BOX;
      }
      p.width = right - left;
      p.height = bottom - top;
      p.x = (left + right) / 2;
      p.y = (top + bottom) / 2;
    }
    clampPred(p);
    markDirty();
    render();
  }

  function onPointerUp() {
    drag = null;
  }

  el.overlay.addEventListener("pointermove", onPointerMove);
  el.overlay.addEventListener("pointerup", onPointerUp);
  el.overlay.addEventListener("pointercancel", onPointerUp);

  async function loadFileJson(stem) {
    const r = await fetch(`./boards/${stem}.json?v=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`Missing ${stem}.json`);
    return r.json();
  }

  async function loadFirebaseJson(stem) {
    const snap = await db.ref(`${FIREBASE_ROOT}/${stem}`).once("value");
    return snap.val();
  }

  async function loadBoard(index, { forceFile = false } = {}) {
    if (dirty && !forceFile) {
      const ok = confirm("You have unsaved changes. Discard them?");
      if (!ok) {
        el.select.value = stems[stemIndex];
        return;
      }
    }
    stemIndex = Math.max(0, Math.min(stems.length - 1, index));
    const stem = stems[stemIndex];
    el.select.value = stem;
    setStatus(`Loading ${stem}…`);
    undoStack = [];
    selected = -1;
    dirty = false;

    filePayload = await loadFileJson(stem);
    let payload = filePayload;
    if (!forceFile) {
      try {
        const fb = await loadFirebaseJson(stem);
        if (fb && Array.isArray(fb.predictions) && fb.predictions.length >= 0 && fb.updatedAt) {
          payload = fb;
          setStatus(`Loaded ${stem} from Firebase (edited)`, "ok");
        } else {
          setStatus(`Loaded ${stem} from file`, "ok");
        }
      } catch (e) {
        setStatus(`Loaded ${stem} from file (Firebase unavailable)`, "");
      }
    } else {
      setStatus(`Reloaded ${stem} from committed file`, "ok");
    }

    imageMeta = payload.image || filePayload.image || { width: 0, height: 0 };
    predictions = clonePreds(payload.predictions || []);
    el.img.onload = () => {
      if (!imageMeta.width || !imageMeta.height) {
        imageMeta = { width: el.img.naturalWidth, height: el.img.naturalHeight };
      }
      render();
    };
    el.img.src = `./boards/${stem}.JPG?v=1`;
    if (el.img.complete) {
      updateScale();
      render();
    }
  }

  function buildSavePayload() {
    const stem = stems[stemIndex];
    const renumbered = renumber(clonePreds(predictions), stem);
    predictions = renumbered;
    return {
      predictions: renumbered,
      image: {
        width: imageMeta.width || el.img.naturalWidth,
        height: imageMeta.height || el.img.naturalHeight
      },
      updatedAt: Date.now(),
      source: "board-box-editor",
      stem
    };
  }

  async function saveBoard() {
    const stem = stems[stemIndex];
    const payload = buildSavePayload();
    setStatus(`Saving ${stem}…`);
    suppressFirebaseEcho = true;
    try {
      await db.ref(`${FIREBASE_ROOT}/${stem}`).set(payload);
      dirty = false;
      localStorage.setItem(`bbe_${SHOW_SLUG}_${stem}`, JSON.stringify(payload));
      render();
      setStatus(`Saved ${stem} · ${payload.predictions.length} pins (Firebase sync)`, "ok");
    } catch (e) {
      setStatus("Save failed: " + e.message, "err");
    } finally {
      setTimeout(() => { suppressFirebaseEcho = false; }, 500);
    }
  }

  function downloadCurrent() {
    const payload = buildSavePayload();
    const blob = new Blob([JSON.stringify({
      predictions: payload.predictions,
      image: payload.image
    }, null, 2) + "\n"], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${stems[stemIndex]}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    setStatus(`Downloaded ${stems[stemIndex]}.json`, "ok");
  }

  el.btnAdd.addEventListener("click", () => {
    pushUndo();
    const W = imageMeta.width || el.img.naturalWidth;
    const H = imageMeta.height || el.img.naturalHeight;
    const w = Math.min(140, W * 0.18);
    const h = Math.min(160, H * 0.18);
    predictions.push({
      x: W / 2,
      y: H / 2,
      width: w,
      height: h,
      confidence: 1,
      class: "pin",
      crop_stem: "new"
    });
    selected = predictions.length - 1;
    markDirty();
    render();
  });

  el.btnDelete.addEventListener("click", () => {
    if (selected < 0) return;
    pushUndo();
    predictions.splice(selected, 1);
    selected = Math.min(selected, predictions.length - 1);
    markDirty();
    render();
  });

  el.btnUndo.addEventListener("click", () => {
    if (!undoStack.length) return;
    predictions = undoStack.pop();
    selected = Math.min(selected, predictions.length - 1);
    markDirty();
    render();
  });

  el.btnSave.addEventListener("click", () => saveBoard());
  el.btnDownload.addEventListener("click", () => downloadCurrent());
  el.btnReset.addEventListener("click", () => loadBoard(stemIndex, { forceFile: true }));
  el.btnPrev.addEventListener("click", () => loadBoard(stemIndex - 1));
  el.btnNext.addEventListener("click", () => loadBoard(stemIndex + 1));
  el.select.addEventListener("change", () => {
    const i = stems.indexOf(el.select.value);
    if (i >= 0) loadBoard(i);
  });

  window.addEventListener("resize", () => render());
  window.addEventListener("keydown", (e) => {
    if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      el.btnUndo.click();
    } else if (e.key === "Delete" || e.key === "Backspace") {
      if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      el.btnDelete.click();
    } else if (e.key === "s" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      saveBoard();
    }
  });

  async function init() {
    const r = await fetch("./boards/manifest.json?v=" + Date.now(), { cache: "no-store" });
    stems = await r.json();
    el.select.innerHTML = stems.map((s, i) => `<option value="${s}">${i + 1}. ${s}</option>`).join("");
    await loadBoard(0);

    // Live sync from other devices for the current board
    db.ref(FIREBASE_ROOT).on("child_changed", (snap) => {
      if (suppressFirebaseEcho) return;
      if (snap.key !== stems[stemIndex]) return;
      if (dirty) return;
      const v = snap.val();
      if (!v || !Array.isArray(v.predictions)) return;
      predictions = clonePreds(v.predictions);
      if (v.image) imageMeta = v.image;
      render();
      setStatus(`Synced ${snap.key} from another device`, "ok");
    });
  }

  init().catch((e) => setStatus("Init failed: " + e.message, "err"));
})();
</script>
</body>
</html>
