<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Fins and Pins - Reports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 15px; background: #0066aa; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; }
        section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f9f9f9; position: sticky; top: 0; }
        tr:hover { background: #f1f7ff; }
        .badge-pull { background: #28a745; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .badge-wait { background: #6c757d; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .feedback-msg { background: #fff9c4; padding: 10px; border-radius: 4px; margin-bottom: 5px; border-left: 4px solid #fbc02d; }
    </style>
</head>
<body>
<div id="authContent" style="display:none;">
    <div class="header"><h1>Reports</h1><div><button class="btn" style="background:#28a745" onclick="downloadCSV()">CSV</button> <a id="backBtn" href="index.html" class="btn">Back</a></div></div>
    
    <section><h2>1. User Tally</h2><table id="userTallyTable"><thead><tr><th>User</th><th>Last Active</th><th>Unique</th><th>Contested</th><th>Total</th></tr></thead><tbody></tbody><tfoot id="userTallyFooter" style="background:#eee; font-weight:bold;"></tfoot></table></section>
    
    <section><h2>2. Live Request Feed</h2><table id="liveFeedTable"><thead><tr><th>Status</th><th>Location</th><th>User</th><th>Time</th><th>Action</th></tr></thead><tbody></tbody></table></section>
    
    <section><h2>3. Popularity (Most Requested)</h2><table id="popularityTable"><thead><tr><th>Location</th><th>Clicks</th><th>Users</th><th>Action</th></tr></thead><tbody></tbody></table></section>

    <section><h2>4. Tester Feedback</h2><div id="feedbackContainer">None.</div></section>
</div>
<div id="authMsg" style="text-align:center; margin-top:100px; font-weight:bold;" onclick="checkAuth(true)">Checking Authorization...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = { apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o", authDomain: "fins-and-pins-click-to-claim.firebaseapp.com", databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com", projectId: "fins-and-pins-click-to-claim", storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app", messagingSenderId: "31512845258", appId: "1:31512845258:web:2124fae24cfee229084d33" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ADMIN_KEY = "0626200207081986";
let globalData = null;

function checkAuth(m=false) { if (new URLSearchParams(window.location.search).get('admin') === ADMIN_KEY || sessionStorage.getItem('fp_admin_active') === 'true' || m) { sessionStorage.setItem('fp_admin_active', 'true'); document.getElementById('authMsg').style.display = 'none'; document.getElementById('authContent').style.display = 'block'; document.getElementById('backBtn').href = `index.html?admin=${ADMIN_KEY}`; loadData(); } }
checkAuth();

async function loadData() {
    const path = window.location.pathname.replace(/\/reports\.html$/, "").replace(/\/$/, ""); 
    const folder = decodeURIComponent(path.split("/").pop() || "default");
    const fbName = folder.replace(/\s+/g, '_');
    const manifest = await (await fetch("./boards/manifest.json")).json();
    manifest.sort((a,b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));
    db.ref(`claims/${fbName}`).on('value', snap => { globalData = { raw: snap.val() || {}, boardList: manifest, showName: folder }; renderReports(); });
    db.ref(`feedback/${fbName}`).on('value', snap => {
        const fb = snap.val() || {}; document.getElementById('feedbackContainer').innerHTML = Object.values(fb).reverse().map(f => `<div class="feedback-msg"><strong>${f.user}</strong> <small>(${new Date(f.time).toLocaleString()})</small><br>${f.msg}</div>`).join('') || "No feedback yet.";
    });
}

function renderReports() {
    const userStats = {}; const liveFeed = []; const popularity = [];
    Object.entries(globalData.raw).forEach(([pk, users]) => {
        const [bName, pIdx] = pk.split("-"); const bNum = globalData.boardList.indexOf(bName) + 1;
        const cleanLoc = `Board ${bNum} (Pin ${parseInt(pIdx)+1})`;
        const uList = Object.entries(users).sort((a,b) => a[1].time - b[1].time);
        const isUnique = uList.length === 1;
        popularity.push({ pin: pk, display: cleanLoc, count: uList.length, users: Object.keys(users).join(', ') });
        uList.forEach(([u, m]) => {
            const user = u.toLowerCase(); if (!userStats[user]) userStats[user] = { last: 0, unique: 0, contested: 0 };
            if (m.time > userStats[user].last) userStats[user].last = m.time;
            if (isUnique) userStats[user].unique++; else userStats[user].contested++;
            liveFeed.push({ pin: pk, display: cleanLoc, user: user, time: m.time, unique: isUnique });
        });
    });

    let tU=0, tC=0, tT=0;
    document.querySelector("#userTallyTable tbody").innerHTML = Object.entries(userStats).sort((a,b) => a[0].localeCompare(b[0])).map(([u, s]) => {
        tU+=s.unique; tC+=s.contested; tT+=(s.unique+s.contested);
        return `<tr><td>${u}</td><td>${new Date(s.last).toLocaleTimeString()}</td><td>${s.unique}</td><td>${s.contested}</td><td>${s.unique+s.contested}</td></tr>`;
    }).join('');
    document.getElementById("userTallyFooter").innerHTML = `<td colspan="2">TOTALS</td><td>${tU}</td><td>${tC}</td><td>${tT}</td>`;
    
    document.querySelector("#liveFeedTable tbody").innerHTML = liveFeed.sort((a,b) => b.time - a.time).map(f => `<tr><td><span class="${f.unique ? 'badge-pull' : 'badge-wait'}">${f.unique ? '📦 PULL' : 'Contested'}</span></td><td>${f.display}</td><td>${f.user}</td><td>${new Date(f.time).toLocaleTimeString()}</td><td><a href="index.html?admin=${ADMIN_KEY}#pin-${f.pin}" style="color:#0066aa; font-weight:bold;">View</a></td></tr>`).join('');
    
    document.querySelector("#popularityTable tbody").innerHTML = popularity.sort((a,b) => b.count - a.count).filter(p => p.count > 0).map(p => `<tr><td>${p.display}</td><td>${p.count}</td><td>${p.users}</td><td><a href="index.html?admin=${ADMIN_KEY}#pin-${p.pin}" style="color:#0066aa; font-weight:bold;">View</a></td></tr>`).join('');
}

function downloadCSV() {
    let csv = "Location,User,Time,Status\n";
    Object.entries(globalData.raw).forEach(([pk, users]) => {
        const status = Object.keys(users).length === 1 ? "Unique" : "Contested";
        Object.entries(users).forEach(([u, m]) => { csv += `${pk},${u},${new Date(m.time).toLocaleString().replace(/,/g,'')},${status}\n`; });
    });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = `Report_${globalData.showName}.csv`; a.click();
}
</script>
</body>
</html>
