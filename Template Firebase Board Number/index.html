<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fins and Pins - Click to Claim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f5f5f5; padding-bottom: 80px; }
        h1 { text-align: center; margin-bottom: 4px; font-size: 26px; }
        h2 { text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 16px; color: #444; font-weight: normal; }
        
        /* Sticky header must have a high z-index but not block clicks below */
        #globalCounts { 
            text-align: center; font-size: 18px; margin-bottom: 20px; font-weight: bold; 
            background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            position: sticky; top: 0; z-index: 2000; 
        }

        #syncStatus { font-size: 12px; color: #666; display: block; margin-top: 4px; font-weight: normal; }

        .board-container { margin-bottom: 40px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .board-title { font-size: 20px; margin-bottom: 6px; font-weight: bold; }
        .board-count { font-size: 14px; margin-bottom: 8px; color: #555; }
        
        /* Ensure wrapper allows absolute pins to be clicked */
        .board-wrapper { position: relative; width: 100%; max-width: 500px; margin: auto; min-height: 300px; background: #eee; border-radius: 6px; }
        .board-img { width: 100%; display: block; border-radius: 6px; }
        
        .pin { 
            position: absolute; border-radius: 6px; border: none; background: transparent; 
            box-sizing: border-box; cursor: pointer; z-index: 100; 
            -webkit-tap-highlight-color: transparent; /* Fix for iOS tapping */
        }
        .pin.claimed { border: 4px solid rgba(0, 128, 0, 0.9); background: rgba(0, 255, 0, 0.25); }
        .pin .checkmark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: black; font-weight: bold; pointer-events: none; display: none; }
        .pin.pulled .checkmark { display: block; }

        #footerControls { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #ddd; padding: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2000; }
        #modeToggleButton { padding: 10px 15px; font-size: 14px; border-radius: 6px; border: 1px solid #333; cursor: pointer; }
        .claim-mode { background: #e6f7ff; color: #0066aa; }
        .pull-mode { background: #ffe9c6; color: #cc8400; }
    </style>
</head>
<body>

<h1>Fins and Pins</h1>
<h2 id="showTitle">Show Date</h2>

<div id="globalCounts">
    <div>Total Pins: <span id="totalPins">0</span> -- Claimed: <span id="totalClaimed">0</span> -- Pulled: <span id="totalPulled">0</span></div>
    <div id="syncStatus">📡 Connecting to Firebase...</div>
</div>

<div id="boardsList"></div>

<div id="footerControls">
    <div id="modeLabel" style="font-weight: bold;">Mode: Claim (Lexi)</div>
    <button id="modeToggleButton" class="claim-mode">Switch to Pull Mode</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Robust Folder Name Detection
const pathClean = window.location.pathname.replace(/\/index\.html$/, "").replace(/\/$/, ""); 
const folderParts = pathClean.split("/");
const showFolderName = decodeURIComponent(folderParts.pop() || "default");
const showNameForFirebase = showFolderName.replace(/\s+/g, '_');

// Title Formatting
(function() {
    const match = showFolderName.match(/(\d{8})/);
    if (match) {
        const raw = match[1];
        const date = new Date(`${raw.substring(0,4)}-${raw.substring(4,6)}-${raw.substring(6,8)}T12:00:00`);
        document.getElementById("showTitle").textContent = date.toLocaleString("en-US", { month: "long", day: "numeric", year: "numeric" }) + " Show";
    } else {
        document.getElementById("showTitle").textContent = showFolderName;
    }
})();

let currentMode = "claim";
let boardsState = {};

// Mode Toggle
const modeBtn = document.getElementById("modeToggleButton");
modeBtn.onclick = () => {
    currentMode = (currentMode === "claim") ? "pull" : "claim";
    document.getElementById("modeLabel").textContent = currentMode === "claim" ? "Mode: Claim (Lexi)" : "Mode: Pull (PinDad Only)";
    modeBtn.className = currentMode === "claim" ? "claim-mode" : "pull-mode";
    modeBtn.textContent = currentMode === "claim" ? "Switch to Pull Mode" : "Switch to Claim Mode";
};

// Load Boards
fetch("./boards/manifest.json")
    .then(r => r.json())
    .then(list => {
        // --- ADDED SORTING ---
        list.sort((a, b) => {
            const numA = parseInt(a.match(/\d+/) || 0);
            const numB = parseInt(b.match(/\d+/) || 0);
            return numA - numB;
        });

        const boardsList = document.getElementById("boardsList");
        // --- MODIFIED TO USE INDEX FOR BOARD # ---
        list.forEach((name, index) => {
            const container = document.createElement("div");
            container.className = "board-container";
            container.id = `container-${name}`;
            container.innerHTML = `
                <div class="board-title">Board ${index + 1} <span style="font-size: 0.7em; font-weight: normal; color: #888;">(${name})</span></div>
                <div class="board-count" id="count-${name}">Loading...</div>
                <div class="board-wrapper" id="wrapper-${name}">
                    <img class="board-img" id="img-${name}" src="./boards/${name}.JPG">
                </div>
            `;
            boardsList.appendChild(container);

            boardsState[name] = { 
                totalPins: 0, claimed: [], 
                pulled: JSON.parse(localStorage.getItem(`pulled-${showFolderName}-${name}`) || "[]") 
            };
            setupBoard(name);
        });
        
        // Connect Firebase
        document.getElementById("syncStatus").textContent = "✅ Connected & Synced";
        listenForFirebase();
    });

async function setupBoard(name) {
    const response = await fetch(`./boards/${name}.json`);
    const data = await response.json();
    const pins = data.predictions || data.output?.predictions || [];
    boardsState[name].totalPins = pins.length;

    const img = document.getElementById(`img-${name}`);
    const render = () => {
        const wrapper = document.getElementById(`wrapper-${name}`);
        let ORIG_W = data.image?.width || img.naturalWidth;
        let ORIG_H = data.image?.height || img.naturalHeight;
        const rotated = (ORIG_W > ORIG_H) !== (img.clientWidth > img.clientHeight);
        const effW = rotated ? ORIG_H : ORIG_W;
        const scale = img.clientWidth / effW;

        pins.forEach((pin, idx) => {
            let rx = rotated ? (ORIG_H - pin.y) : pin.x;
            let ry = rotated ? pin.x : pin.y;
            let rw = rotated ? pin.height : pin.width;
            let rh = rotated ? pin.width : pin.height;

            const div = document.createElement("div");
            div.className = "pin";
            div.style.left = (rx - rw / 2) * scale + "px";
            div.style.top = (ry - rh / 2) * scale + "px";
            div.style.width = (rw * scale) + "px";
            div.style.height = (rh * scale) + "px";
            div.id = `pin-${name}-${idx}`;
            div.innerHTML = `<span class="checkmark">✓</span>`;
            
            if (boardsState[name].pulled.includes(idx)) div.classList.add("pulled");
            div.onclick = (e) => {
                e.preventDefault(); // Stop ghost clicks on mobile
                handlePinClick(name, idx, div);
            };
            wrapper.appendChild(div);
        });
        updateBoardDisplay(name);
        calculateGlobals();
    };
    if (img.complete) render(); else img.onload = render;
}

function handlePinClick(boardName, idx, div) {
    if (currentMode === "claim") {
        const isCurrentlyClaimed = div.classList.contains("claimed");
        db.ref(`claims/${showNameForFirebase}/${boardName}-${idx}`).set(isCurrentlyClaimed ? null : true);
    } else {
        const state = boardsState[boardName];
        const isPulled = div.classList.toggle("pulled");
        if (isPulled) { if (!state.pulled.includes(idx)) state.pulled.push(idx); }
        else { state.pulled = state.pulled.filter(i => i !== idx); }
        localStorage.setItem(`pulled-${showFolderName}-${boardName}`, JSON.stringify(state.pulled));
        updateBoardDisplay(boardName);
        calculateGlobals();
    }
}

function listenForFirebase() {
    db.ref(`claims/${showNameForFirebase}`).on("value", snapshot => {
        const allClaims = snapshot.val() || {};
        Object.keys(boardsState).forEach(b => {
            boardsState[b].claimed = [];
            document.querySelectorAll(`[id^="pin-${b}-"]`).forEach(el => el.classList.remove("claimed"));
        });
        Object.keys(allClaims).forEach(key => {
            const [bName, pIdx] = key.split("-");
            if (boardsState[bName]) {
                boardsState[bName].claimed.push(parseInt(pIdx));
                const el = document.getElementById(`pin-${bName}-${pIdx}`);
                if (el) el.classList.add("claimed");
            }
        });
        Object.keys(boardsState).forEach(updateBoardDisplay);
        calculateGlobals();
    });
}

function updateBoardDisplay(name) {
    const s = boardsState[name];
    document.getElementById(`count-${name}`).textContent = `Pins: ${s.totalPins} | Claimed: ${s.claimed.length} | Pulled: ${s.pulled.length}`;
}

function calculateGlobals() {
    let total = 0, claimed = 0, pulled = 0;
    Object.values(boardsState).forEach(s => {
        total += s.totalPins;
        claimed += s.claimed.length;
        pulled += s.pulled.length;
    });
    document.getElementById("totalPins").textContent = total;
    document.getElementById("totalClaimed").textContent = claimed;
    document.getElementById("totalPulled").textContent = pulled;
}
</script>
</body>
</html>
