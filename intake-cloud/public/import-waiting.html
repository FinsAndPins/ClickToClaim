<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Finding pins…</title>
  <style>
    :root {
      --bg: #0a0c12;
      --text: #f4f6fb;
      --muted: #9aa3b5;
      --accent: #44b4ea;
      --box: #3db8f5;
      --bar: #2a3148;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #05060a;
    }
    #boardWrap {
      position: relative;
      max-width: 100vw; max-height: calc(100dvh - 120px);
      width: min(100vw, 720px);
    }
    #boardImg {
      display: block; width: 100%; height: auto;
      max-height: calc(100dvh - 120px);
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
      opacity: 0; transition: opacity 0.45s ease;
    }
    #boardImg.on { opacity: 1; }
    #overlay {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .trace-box {
      position: absolute;
      border: 2.5px solid var(--box);
      box-shadow: 0 0 12px rgba(61, 184, 245, 0.35);
      background: rgba(61, 184, 245, 0.08);
      opacity: 0;
      animation: boxIn 0.45s ease forwards;
    }
    @keyframes boxIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace-box { animation: none; opacity: 1; }
    }
    #footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(5,6,10,0.92) 28%);
      text-align: center;
    }
    #title {
      font-size: 15px; font-weight: 800; letter-spacing: 0.02em; margin: 0 0 4px;
    }
    #subtitle {
      font-size: 13px; color: var(--muted); margin: 0 0 12px; min-height: 1.2em;
    }
    #bar {
      height: 8px; border-radius: 999px; background: var(--bar);
      overflow: hidden; max-width: 420px; margin: 0 auto;
    }
    #bar > i {
      display: block; height: 100%; width: 8%;
      background: linear-gradient(90deg, #2a8fd4, var(--accent));
      border-radius: inherit;
      transition: width 0.4s ease;
    }
    #err {
      display: none; position: fixed; inset: 0;
      align-items: center; justify-content: center;
      padding: 24px; background: var(--bg); text-align: center;
    }
    #err.open { display: flex; flex-direction: column; gap: 12px; }
    #err a {
      color: var(--accent); font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="boardWrap">
      <img id="boardImg" alt="" />
      <div id="overlay"></div>
    </div>
  </div>
  <div id="footer">
    <p id="title">Finding pins on your boards…</p>
    <p id="subtitle">Same step as in the app</p>
    <div id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8"><i id="barFill"></i></div>
  </div>
  <div id="err">
    <p id="errText">Something stalled.</p>
    <a id="errRetry" href="#">Try again</a>
  </div>
<script>
(function () {
  const token = (window.__BOX_TOKEN__ || new URLSearchParams(location.search).get("token") || "").trim();
  const title = document.getElementById("title");
  const subtitle = document.getElementById("subtitle");
  const barFill = document.getElementById("barFill");
  const bar = document.getElementById("bar");
  const img = document.getElementById("boardImg");
  const overlay = document.getElementById("overlay");
  const err = document.getElementById("err");
  const errText = document.getElementById("errText");
  const errRetry = document.getElementById("errRetry");

  if (!token) {
    err.classList.add("open");
    errText.textContent = "Missing review link.";
    return;
  }
  errRetry.href = "/boxes/" + encodeURIComponent(token);

  let photos = [];
  let photoIndex = 0;
  let progress = 8;
  let started = Date.now();
  let ready = false;
  /** @type {{ filename: string, predictions: any[], imageUrl?: string }[]} */
  let detectedBoards = [];
  let detectedIndex = 0;
  let naturalW = 0;
  let naturalH = 0;

  function setProgress(p, label, sub) {
    progress = Math.max(progress, Math.min(96, p));
    barFill.style.width = progress + "%";
    bar.setAttribute("aria-valuenow", String(Math.round(progress)));
    if (label) title.textContent = label;
    if (sub != null) subtitle.textContent = sub;
  }

  function clearBoxes() {
    overlay.innerHTML = "";
  }

  /** Draw real RF-DETR boxes (center x/y + width/height in image pixels), like the iOS import movie. */
  function drawRealBoxes(preds) {
    clearBoxes();
    if (!preds || !preds.length || !naturalW || !naturalH) return;
    const dispW = img.clientWidth || 1;
    const dispH = img.clientHeight || 1;
    const scale = Math.min(dispW / naturalW, dispH / naturalH);
    const drawW = naturalW * scale;
    const drawH = naturalH * scale;
    const ox = (dispW - drawW) / 2;
    const oy = (dispH - drawH) / 2;
    preds.forEach((p, i) => {
      const cx = Number(p.x);
      const cy = Number(p.y);
      const w = Number(p.width);
      const h = Number(p.height);
      if (!(w > 0 && h > 0)) return;
      const left = ox + (cx - w / 2) * scale;
      const top = oy + (cy - h / 2) * scale;
      const el = document.createElement("div");
      el.className = "trace-box";
      el.style.left = left + "px";
      el.style.top = top + "px";
      el.style.width = w * scale + "px";
      el.style.height = h * scale + "px";
      el.style.animationDelay = Math.min(i, 24) * 0.03 + "s";
      overlay.appendChild(el);
    });
  }

  function showDetectedBoard(i) {
    if (!detectedBoards.length) return;
    detectedIndex = ((i % detectedBoards.length) + detectedBoards.length) % detectedBoards.length;
    const b = detectedBoards[detectedIndex];
    const url = b.imageUrl;
    if (!url) return;
    img.classList.remove("on");
    img.onload = () => {
      naturalW = img.naturalWidth || 0;
      naturalH = img.naturalHeight || 0;
      img.classList.add("on");
      drawRealBoxes(b.predictions || []);
    };
    if (img.src.indexOf(url) >= 0 && img.complete && naturalW) {
      img.classList.add("on");
      drawRealBoxes(b.predictions || []);
    } else {
      img.src = url + (url.includes("?") ? "&" : "?") + "v=" + Date.now();
    }
  }

  function showPhoto(i) {
    if (detectedBoards.length) {
      showDetectedBoard(i);
      return;
    }
    if (!photos.length) return;
    photoIndex = ((i % photos.length) + photos.length) % photos.length;
    const p = photos[photoIndex];
    img.classList.remove("on");
    clearBoxes();
    img.onload = () => {
      naturalW = img.naturalWidth || 0;
      naturalH = img.naturalHeight || 0;
      img.classList.add("on");
    };
    img.src = p.url + (p.url.includes("?") ? "&" : "?") + "v=" + Date.now();
  }

  async function loadPhotosOnce() {
    const res = await fetch("/api/boxes/" + encodeURIComponent(token) + "/photos", { cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) return { ok: false, photos: [], error: data.error || "Could not load photos" };
    return { ok: true, photos: data.photos || [] };
  }

  async function loadDetectedBoards() {
    const res = await fetch("/api/boxes/" + encodeURIComponent(token) + "/session", { cache: "no-store" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) return [];
    const boards = data.boards || [];
    return boards
      .filter((b) => b && b.filename && (b.predictions || []).length)
      .map((b) => ({
        filename: b.filename,
        predictions: b.predictions || [],
        imageUrl:
          "/api/boxes/" +
          encodeURIComponent(token) +
          "/file/boards/" +
          encodeURIComponent(b.filename),
      }));
  }

  async function ensurePhotos() {
    setProgress(10, "Saving your photos…", "Uploaded boards are being stored");
    const deadline = Date.now() + 3 * 60 * 1000;
    while (Date.now() < deadline) {
      const got = await loadPhotosOnce();
      if (got.ok && got.photos.length) {
        photos = got.photos;
        showPhoto(0);
        setProgress(
          22,
          "Finding pins…",
          "Importing " + photos.length + " board" + (photos.length === 1 ? "" : "s")
        );
        return;
      }
      await new Promise((r) => setTimeout(r, 1500));
    }
    throw new Error("Photos are still saving. Tap Try again in a moment.");
  }

  function goEditor(pins) {
    if (ready) return;
    ready = true;
    setProgress(100, pins != null ? pins + " pins found" : "Boxes ready", "Opening editor…");
    barFill.style.width = "100%";
    // Entertainment only: never hold the seller for box-trace animations.
    location.replace("/boxes/" + encodeURIComponent(token) + "/editor");
  }

  /** Movie/overlay refresh must never block the ready check. */
  function refreshMovieInBackground() {
    if (ready) return;
    Promise.resolve()
      .then(async () => {
        if (!photos.length) {
          const got = await loadPhotosOnce();
          if (ready) return;
          if (got.ok && got.photos.length) {
            photos = got.photos;
            if (!img.classList.contains("on") && !detectedBoards.length) showPhoto(0);
          }
        }
        const detected = await loadDetectedBoards();
        if (ready) return;
        if (detected.length) {
          const grew = detected.length > detectedBoards.length;
          detectedBoards = detected;
          if (grew || !img.classList.contains("on")) showDetectedBoard(detectedIndex);
        }
      })
      .catch(() => {});
  }

  async function poll() {
    if (ready) return;
    try {
      // Completion first. Box movie is decorative and runs in parallel.
      const res = await fetch("/api/boxes/" + encodeURIComponent(token) + "/status", { cache: "no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "status " + res.status);

      if (data.ready) {
        goEditor(data.pin_count != null ? data.pin_count : null);
        return;
      }

      refreshMovieInBackground();

      if (data.failed) {
        setProgress(progress, "Still working…", "Retrying detect…");
      } else {
        const phase = data.phase || data.status || "";
        const pins = data.pin_count;
        const bd = data.boards_done;
        const bt = data.boards_total;
        if (!photos.length) {
          setProgress(12 + Math.min(15, (Date.now() - started) / 2000), "Saving your photos…", data.label || "Hang tight");
        } else if (phase === "detecting" || phase === "cloud_running" || phase === "cloud_queued" || !phase) {
          const boardSub =
            bd != null && bt != null
              ? "Board " + bd + " of " + bt
              : detectedBoards.length
                ? detectedBoards.length + " board" + (detectedBoards.length === 1 ? "" : "s") + " with boxes"
                : "Looking for pins on your boards";
          setProgress(35 + Math.min(40, (Date.now() - started) / 800), "Finding pins…", boardSub);
        } else if (phase === "board_ready") {
          // Server already marks ready on first board_ready; this is only if status lags.
          setProgress(
            bt ? Math.min(90, 40 + (60 * (bd || 1)) / bt) : 70,
            bd != null && bt != null ? ("Board " + bd + " of " + bt + " ready") : "Boards ready…",
            "Opening editor…"
          );
        } else if (phase === "prefetching") {
          setProgress(78, pins != null ? (pins + " pins · starting prices") : "Pins found", "Almost ready…");
        } else if (phase === "detect_ready" || phase === "awaiting_box_confirm") {
          setProgress(92, pins != null ? (pins + " pins found") : "Boxes ready", "Opening editor…");
        } else {
          setProgress(30 + Math.min(25, (Date.now() - started) / 1500), "Finding pins…", data.label || "Working…");
        }
        if (pins != null && pins > 0) {
          subtitle.textContent =
            pins +
            " pin" +
            (pins === 1 ? "" : "s") +
            " found" +
            (bd != null && bt != null ? " · board " + bd + "/" + bt : "");
        }
      }
    } catch (e) {
      /* keep polling; movie is optional */
      refreshMovieInBackground();
    }
    setTimeout(poll, 800);
  }

  setInterval(() => {
    if (ready) return;
    if (detectedBoards.length > 1) showDetectedBoard(detectedIndex + 1);
    else if (photos.length > 1 && !detectedBoards.length) showPhoto(photoIndex + 1);
  }, 2800);

  window.addEventListener("resize", () => {
    if (ready) return;
    if (detectedBoards.length) drawRealBoxes(detectedBoards[detectedIndex]?.predictions || []);
  });

  ensurePhotos()
    .then(() => {
      if (!ready) refreshMovieInBackground();
    })
    .catch((e) => {
      if (ready) return;
      err.classList.add("open");
      errText.textContent = e && e.message ? e.message : String(e);
    });
  poll();
})();
</script>
</body>
</html>
