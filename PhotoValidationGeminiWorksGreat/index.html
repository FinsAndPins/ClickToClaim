<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Validator – Sync Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #121212; color: white; overflow: hidden; }
        #topBar { display: flex; justify-content: space-between; padding: 15px; background: #222; border-bottom: 1px solid #333; font-weight: bold; }
        
        /* Image Display Area */
        #displayArea { height: 60vh; display: flex; gap: 10px; padding: 10px; visibility: hidden; }
        .imgBox { flex: 1; background: #2a2a2a; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #444; }
        .imgBox img { max-width: 98%; max-height: 98%; object-fit: contain; }
        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #aaa; }

        #titleBox { height: 80px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 20px; font-size: 22px; background: #121212; }

        /* Buttons */
        #controls { display: flex; gap: 12px; padding: 15px; align-items: center; height: 120px; }
        button { border: none; border-radius: 16px; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s, opacity 0.1s; }
        button:active { transform: scale(0.96); opacity: 0.8; }
        
        .btn-main { flex: 2; height: 100%; font-size: 32px; }
        .btn-sub { flex: 0.8; height: 70%; font-size: 16px; background: #444; }
        
        #matchBtn { background: #28a745; }
        #noMatchBtn { background: #dc3545; }
        
        #loadingOverlay { position: fixed; top: 70px; left: 0; right: 0; bottom: 250px; display: flex; align-items: center; justify-content: center; background: #121212; z-index: 5; }
    </style>
</head>
<body>

<div id="topBar">
    <div id="progress">Loading...</div>
    <div id="userDisplay">@user</div>
</div>

<div id="loadingOverlay">🚀 Synchronizing Images...</div>

<div id="displayArea">
    <div class="imgBox"><span class="badge">MY PHOTO</span><img id="cropImg"></div>
    <div class="imgBox"><span class="badge">EBAY MATCH</span><img id="thumbImg"></div>
</div>

<div id="titleBox">---</div>

<div id="controls">
    <button id="noMatchBtn" class="btn-main" onclick="submitResult('no_match')">❌ NO</button>
    <button id="unknownBtn" class="btn-sub" onclick="submitResult('unknown')">Don't Know</button>
    <button id="matchBtn" class="btn-main" onclick="submitResult('match')">✅ MATCH</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const fbPath = "photo_validation/run_march_2026"; 

let user = localStorage.getItem("validator_user") || prompt("Enter Name:") || "Guest";
if (!user.startsWith("@")) user = "@" + user;
localStorage.setItem("validator_user", user);
document.getElementById("userDisplay").textContent = user;

let items = {};
let itemKeys = [];
let validated = {};

fetch("./pending_items.json").then(r => r.json()).then(data => {
    items = data;
    itemKeys = Object.keys(items);
    db.ref(fbPath).on("value", snap => {
        validated = snap.val() || {};
        loadNext();
    });
});

function loadNext() {
    let nextKey = itemKeys.find(k => !validated[k.replace(/\./g, "_")]);

    if (nextKey) {
        const item = items[nextKey];
        const display = document.getElementById("displayArea");
        const overlay = document.getElementById("loadingOverlay");
        
        display.style.visibility = "hidden";
        overlay.style.display = "flex";

        // PRE-LOADER LOGIC
        let loaded = 0;
        const img1 = new Image();
        const img2 = new Image();

        const checkReady = () => {
            loaded++;
            if (loaded === 2) {
                document.getElementById("cropImg").src = img1.src;
                document.getElementById("thumbImg").src = img2.src;
                document.getElementById("titleBox").textContent = item.title;
                overlay.style.display = "none";
                display.style.visibility = "visible";
            }
        };

        img1.onload = checkReady;
        img2.onload = checkReady;
        img1.src = item.crop;
        img2.src = item.thumb;

        document.getElementById("progress").textContent = `${Object.keys(validated).length} / ${itemKeys.length} Pins`;
    } else {
        document.getElementById("mainArea").innerHTML = "<h1 style='text-align:center; padding-top:100px;'>DONE! 🎉 Check Reports</h1>";
    }
}

function submitResult(status) {
    let currentKey = itemKeys.find(k => !validated[k.replace(/\./g, "_")]);
    if (!currentKey) return;

    db.ref(`${fbPath}/${currentKey.replace(/\./g, "_")}`).set({
        status: status,
        reviewer: user,
        timestamp: Date.now(),
        filename: currentKey
    });
}
</script>
</body>
</html>
