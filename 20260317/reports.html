function getQuadrant(x, y, rotated) {
    const dx = rotated ? (100 - y) : x;
    const dy = rotated ? x : y;
    return `${dy < 50 ? "Upper" : "Lower"} ${dx < 50 ? "Left" : "Right"}`;
}

function createSnippetHTML(boardName, pin, rotated, isUnique) {
    if (!isUnique || !pin) return `<div style="color:#888; font-size:10px; text-align:center; padding-top:20px;">Contested</div>`;
    const zoom = 8;
    const dx = rotated ? (100 - pin.y) : pin.x;
    const dy = rotated ? pin.x : pin.y;
    return `<div class="pin-snippet"><img src="./boards/${boardName}.JPG" style="width: ${100 * zoom}%; left: 50%; top: 50%; transform: translate(-${dx}%, -${dy}%); position: absolute; display: block;"></div>`;
}
