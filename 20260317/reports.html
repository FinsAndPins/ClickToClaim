<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fins and Pins - Final Reports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 15px; background: #0066aa; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; }
        .btn-csv { background: #28a745; }
        section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        th { background: #f9f9f9; position: sticky; top: 0; }
        tr:hover { background: #f1f7ff; }
        .pin-link { color: #0066aa; font-weight: bold; text-decoration: underline; cursor: pointer; }
        #authMsg { text-align: center; margin-top: 100px; font-weight: bold; }
    </style>
</head>
<body>

<div id="authContent" style="display:none;">
    <div class="header">
        <h1>Show Reports</h1>
        <div>
            <button class="btn btn-csv" onclick="downloadCSV()">Download CSV</button>
            <a id="backBtn" href="index.html" class="btn">Back to Boards</a>
        </div>
    </div>

    <section>
        <h2>1. User Tally</h2>
        <table id="userTallyTable">
            <thead><tr><th>User</th><th>Last Active</th><th>Unique</th><th>Contested</th><th>Total</th></tr></thead>
            <tbody></tbody>
            <tfoot><tr id="userTallyFooter" style="font-weight:bold; background:#eee;"></tr></tfoot>
        </table>
    </section>

    <section>
        <h2>2. Live Request Feed (Newest First)</h2>
        <table id="liveFeedTable">
            <thead><tr><th>Board-Pin</th><th>User</th><th>Time</th><th>Action</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>

    <section>
        <h2>3. Popularity (Bidding Wars)</h2>
        <table id="popularityTable">
            <thead><tr><th>Board-Pin</th><th>Clicks</th><th>Users</th></tr></thead>
            <tbody></tbody>
        </table>
    </section>
</div>

<div id="authMsg" onclick="checkAuth(true)">Checking Admin Authorization...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_KEY = "0626200207081986";
let globalReportData = null;

function checkAuth(manual = false) {
    const urlKey = new URLSearchParams(window.location.search).get('admin');
    if (urlKey === ADMIN_KEY || sessionStorage.getItem('fp_admin_active') === 'true' || manual) {
        sessionStorage.setItem('fp_admin_active', 'true');
        document.getElementById('authMsg').style.display = 'none';
        document.getElementById('authContent').style.display = 'block';
        document.getElementById('backBtn').href = `index.html?admin=${ADMIN_KEY}`;
        loadData();
    }
}
checkAuth();

async function loadData() {
    const pathClean = window.location.pathname.replace(/\/reports\.html$/, "").replace(/\/$/, ""); 
    const folderParts = pathClean.split("/");
    const showFolderName = decodeURIComponent(folderParts.pop() || "default");
    const showNameForFirebase = showFolderName.replace(/\s+/g, '_');

    db.ref(`claims/${showNameForFirebase}`).on('value', snapshot => {
        globalReportData = { raw: snapshot.val() || {}, showName: showFolderName };
        renderReports(globalReportData.raw);
    });
}

function renderReports(data) {
    const userStats = {};
    const liveFeed = [];
    const popularity = [];
    const pinCounts = {};

    Object.entries(data).forEach(([pinKey, users]) => {
        const userList = Object.entries(users).sort((a,b) => a[1].time - b[1].time);
        pinCounts[pinKey] = userList.length;
        
        popularity.push({ pin: pinKey, count: userList.length, users: Object.keys(users).join(', ') });

        userList.forEach(([username, meta]) => {
            const u = username.toLowerCase();
            if (!userStats[u]) userStats[u] = { last: 0, unique: 0, contested: 0 };
            if (meta.time > userStats[u].last) userStats[u].last = meta.time;
            
            if (Object.keys(users).length === 1) userStats[u].unique++;
            else userStats[u].contested++;

            liveFeed.push({ pin: pinKey, user: u, time: meta.time });
        });
    });

    // 1. User Tally
    let tU=0, tC=0, tT=0;
    document.querySelector("#userTallyTable tbody").innerHTML = Object.entries(userStats).sort((a,b) => a[0].localeCompare(b[0])).map(([u, s]) => {
        tU += s.unique; tC += s.contested; tT += (s.unique + s.contested);
        return `<tr><td>${u}</td><td>${new Date(s.last).toLocaleTimeString()}</td><td>${s.unique}</td><td>${s.contested}</td><td>${s.unique+s.contested}</td></tr>`;
    }).join('');
    document.getElementById("userTallyFooter").innerHTML = `<td colspan="2">TOTALS</td><td>${tU}</td><td>${tC}</td><td>${tT}</td>`;

    // 2. Live Feed
    document.querySelector("#liveFeedTable tbody").innerHTML = liveFeed.sort((a,b) => b.time - a.time).map(f => `
        <tr>
            <td>${f.pin}</td>
            <td>${f.user}</td>
            <td>${new Date(f.time).toLocaleTimeString()}</td>
            <td><a href="index.html?admin=${ADMIN_KEY}#pin-${f.pin}" class="pin-link">View on Board</a></td>
        </tr>
    `).join('');

    // 3. Popularity
    document.querySelector("#popularityTable tbody").innerHTML = popularity.sort((a,b) => b.count - a.count).filter(p => p.count > 0).map(p => `
        <tr><td>${p.pin}</td><td>${p.count}</td><td>${p.users}</td></tr>
    `).join('');
}

function downloadCSV() {
    if (!globalReportData) return;
    let csv = "Pin,User,Time,Status\n";
    Object.entries(globalReportData.raw).forEach(([pk, users]) => {
        const status = Object.keys(users).length === 1 ? "Unique" : "Contested";
        Object.entries(users).forEach(([u, m]) => {
            csv += `${pk},${u},${new Date(m.time).toLocaleString().replace(/,/g,'')},${status}\n`;
        });
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `FinsAndPins_${globalReportData.showName}.csv`;
    a.click();
}
</script>
</body>
</html>
