<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fins and Pins - Show Reports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 10px 15px; background: #0066aa; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .btn-csv { background: #28a745; }
        section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; overflow-x: auto; }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        th { background: #f9f9f9; position: sticky; top: 0; z-index: 10; }
        tfoot td { background: #f9f9f9; font-weight: bold; border-top: 2px solid #333; }
        tr:hover { background: #f1f7ff; }
        .timestamp { color: #888; font-size: 12px; }
        
        /* Snippet Window */
        .pin-snippet { 
            width: 70px; height: 70px; border-radius: 4px; border: 1px solid #ccc; 
            overflow: hidden; position: relative; background-color: #eee; 
        }
        .pin-snippet img { position: absolute; }
        
        #authMsg { text-align: center; margin-top: 100px; color: red; font-weight: bold; }
    </style>
</head>
<body>

<div id="authContent" style="display:none;">
    <div class="header">
        <h1>Show Reports</h1>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-csv" onclick="downloadCSV()">Download CSV</button>
            <a id="backBtn" href="index.html" class="btn">Back to Boards</a>
        </div>
    </div>

    <section>
        <h2>1. User Tally (By Username)</h2>
        <table id="userTallyTable">
            <thead>
                <tr><th>Username</th><th>Last Activity</th><th>Unique</th><th>Contested</th><th>Total</th></tr>
            </thead>
            <tbody></tbody>
            <tfoot><tr id="userTallyFooter"></tr></tfoot>
        </table>
    </section>

    <section>
        <h2>2. Live Request Feed (Newest First)</h2>
        <table id="liveFeedTable">
            <thead>
                <tr><th>Pin</th><th>Location</th><th>User</th><th>Time</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section>
        <h2>3. Popularity (Most Wanted)</h2>
        <table id="popularityTable">
            <thead>
                <tr><th>Pin</th><th>Location</th><th>Clicks</th><th>Interested Users</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</div>

<div id="authMsg">Checking Admin Authorization...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_KEY = "0626200207081986";
const isAdmin = new URLSearchParams(window.location.search).get('admin') === ADMIN_KEY || sessionStorage.getItem('fp_admin_active') === 'true';

let globalReportData = null;
let boardNames = []; 

if (!isAdmin) {
    document.getElementById('authMsg').textContent = "Unauthorized.";
} else {
    document.getElementById('authMsg').style.display = 'none';
    document.getElementById('authContent').style.display = 'block';
    document.getElementById('backBtn').href = `index.html?admin=${ADMIN_KEY}`;
    loadData();
}

function getQuadrant(x, y) {
    const horizontal = x < 50 ? "Left" : "Right";
    const vertical = y < 50 ? "Upper" : "Lower";
    return `${vertical} ${horizontal}`;
}

function createSnippetHTML(boardName, pin) {
    if (!pin) return `<div class="pin-snippet"></div>`;
    const zoom = 7; 
    const imgPath = `./boards/${boardName}.JPG`;
    return `
        <div class="pin-snippet">
            <img src="${imgPath}" 
                 style="width: ${zoom * 100}%; position: absolute; left: ${50 - (pin.x * zoom)}%; top: ${50 - (pin.y * zoom)}%;"
                 onerror="this.parentElement.style.border='2px solid red';">
        </div>`;
}

async function loadData() {
    const pathClean = window.location.pathname.replace(/\/reports\.html$/, "").replace(/\/$/, ""); 
    const folderParts = pathClean.split("/");
    const showFolderName = decodeURIComponent(folderParts.pop() || "default");
    const showNameForFirebase = showFolderName.replace(/\s+/g, '_');

    const manifestRes = await fetch("./boards/manifest.json");
    boardNames = await manifestRes.json();
    boardNames.sort((a, b) => parseInt(a.match(/\d+/) || 0) - parseInt(b.match(/\d+/) || 0));

    const boardMeta = {};
    for (const name of boardNames) {
        const res = await fetch(`./boards/${name}.json`);
        const data = await res.json();
        boardMeta[name] = data.predictions || data.output?.predictions || [];
    }

    db.ref(`claims/${showNameForFirebase}`).on('value', snapshot => {
        globalReportData = { raw: snapshot.val() || {}, meta: boardMeta, showName: showFolderName };
        renderReports(globalReportData.raw, boardMeta);
    });
}

function renderReports(data, boardMeta) {
    const userStats = {};
    const liveFeed = [];
    const popularity = [];
    const globalPinCounts = {};
    
    Object.keys(data).forEach(pk => globalPinCounts[pk] = Object.keys(data[pk]).length);

    Object.entries(data).forEach(([pinKey, users]) => {
        const [bName, pIdx] = pinKey.split("-");
        const boardNum = boardNames.indexOf(bName) + 1;
        const pinData = boardMeta[bName][pIdx];
        const quad = pinData ? getQuadrant(pinData.x, pinData.y) : "Unknown";
        const locStr = `Board ${boardNum} (${quad})`;
        const snippet = createSnippetHTML(bName, pinData);

        const userEntries = Object.entries(users).sort((a,b) => a[1].time - b[1].time);
        popularity.push({ snippet, loc: locStr, count: userEntries.length, details: userEntries.map(([u, t]) => `${u} (${new Date(t.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})})`).join(", ") });

        userEntries.forEach(([username, meta]) => {
            if (!userStats[username]) userStats[username] = { lastAction: 0, unique: 0, contested: 0 };
            if (meta.time > userStats[username].lastAction) userStats[username].lastAction = meta.time;
            if (globalPinCounts[pinKey] === 1) userStats[username].unique++; else userStats[username].contested++;
            liveFeed.push({ snippet, loc: locStr, user: username, time: meta.time });
        });
    });

    // 1. User Tally
    let tU = 0, tC = 0, tT = 0;
    document.querySelector("#userTallyTable tbody").innerHTML = Object.entries(userStats).sort((a,b) => a[0].localeCompare(b[0])).map(([u, s]) => {
        const total = s.unique + s.contested;
        tU += s.unique; tC += s.contested; tT += total;
        return `<tr><td><strong>${u}</strong></td><td class="timestamp">${new Date(s.lastAction).toLocaleTimeString()}</td><td>${s.unique}</td><td>${s.contested}</td><td><strong>${total}</strong></td></tr>`;
    }).join('');
    document.getElementById("userTallyFooter").innerHTML = `<td colspan="2">TOTALS</td><td>${tU}</td><td>${tC}</td><td>${tT}</td>`;

    // 2. Live Feed
    document.querySelector("#liveFeedTable tbody").innerHTML = liveFeed.sort((a,b) => b.time - a.time).map(f => `<tr><td>${f.snippet}</td><td>${f.loc}</td><td><strong>${f.user}</strong></td><td class="timestamp">${new Date(f.time).toLocaleTimeString()}</td></tr>`).join('');

    // 3. Popularity
    document.querySelector("#popularityTable tbody").innerHTML = popularity.sort((a,b) => b.count - a.count).map(p => `<tr><td>${p.snippet}</td><td>${p.loc}</td><td><strong>${p.count}</strong></td><td style="font-size: 11px; color: #666;">${p.details}</td></tr>`).join('');
}

function downloadCSV() {
    if (!globalReportData) return alert("No data.");
    let csv = "Board-Pin,Board Number,Quadrant,Username,Timestamp,Status\n";
    Object.entries(globalReportData.raw).forEach(([pk, users]) => {
        const [bn, pi] = pk.split("-");
        const bNum = boardNames.indexOf(bn) + 1;
        const pd = globalReportData.meta[bn][pi];
        const q = pd ? getQuadrant(pd.x, pd.y) : "Unknown";
        const st = Object.keys(users).length === 1 ? "Unique" : "Contested";
        Object.entries(users).forEach(([un, mt]) => {
            csv += `${pk},Board ${bNum},${q},${un},"${new Date(mt.time).toLocaleString()}",${st}\n`;
        });
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", `FinsAndPins_${globalReportData.showName}.csv`);
    link.click();
}
</script>
</body>
</html>
