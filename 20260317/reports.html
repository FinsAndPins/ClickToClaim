<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fins and Pins - Show Reports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 10px 15px; background: #0066aa; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .btn-csv { background: #28a745; }
        section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 30px; overflow-x: auto; }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        th { background: #f9f9f9; position: sticky; top: 0; z-index: 10; }
        tfoot td { background: #f9f9f9; font-weight: bold; border-top: 2px solid #333; }
        tr:hover { background: #f1f7ff; }
        .timestamp { color: #888; font-size: 12px; }
        .pin-snippet { width: 60px; height: 60px; border-radius: 4px; border: 1px solid #ccc; overflow: hidden; position: relative; background-color: #333; }
        .pin-snippet img { position: absolute; transform: translate(-50%, -50%); top: 50%; left: 50%; width: 500px; height: auto; }
        #authMsg { text-align: center; margin-top: 100px; color: red; font-weight: bold; }
    </style>
</head>
<body>

<div id="authContent" style="display:none;">
    <div class="header">
        <h1>Show Reports</h1>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-csv" onclick="downloadCSV()">Download CSV</button>
            <a id="backBtn" href="index.html" class="btn">Back to Boards</a>
        </div>
    </div>

    <section>
        <h2>1. User Tally (By Username)</h2>
        <table id="userTallyTable">
            <thead>
                <tr><th>Username</th><th>Last Activity</th><th>Unique</th><th>Contested</th><th>Total</th></tr>
            </thead>
            <tbody></tbody>
            <tfoot><tr id="userTallyFooter"></tr></tfoot>
        </table>
    </section>

    <section>
        <h2>2. Live Request Feed (Newest First)</h2>
        <table id="liveFeedTable">
            <thead>
                <tr><th>Pin</th><th>Location</th><th>User</th><th>Time</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section>
        <h2>3. Popularity (Most Wanted)</h2>
        <table id="popularityTable">
            <thead>
                <tr><th>Pin</th><th>Location</th><th>Clicks</th><th>Interested Users</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</div>

<div id="authMsg">Checking Admin Authorization...</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
    authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
    databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com",
    projectId: "fins-and-pins-click-to-claim",
    storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
    messagingSenderId: "31512845258",
    appId: "1:31512845258:web:2124fae24cfee229084d33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ADMIN_KEY = "0626200207081986";
const isAdmin = new URLSearchParams(window.location.search).get('admin') === ADMIN_KEY || sessionStorage.getItem('fp_admin_active') === 'true';

let globalReportData = null;

if (!isAdmin) {
    document.getElementById('authMsg').textContent = "Unauthorized.";
} else {
    document.getElementById('authMsg').style.display = 'none';
    document.getElementById('authContent').style.display = 'block';
    document.getElementById('backBtn').href = `index.html?admin=${ADMIN_KEY}`;
    loadData();
}

function getQuadrant(x, y, isRotated) {
    // If rotated, x and y logic swaps
    const horizontal = (isRotated ? y : x) < 50 ? "Left" : "Right";
    const vertical = (isRotated ? x : y) < 50 ? "Upper" : "Lower";
    return `${vertical} ${horizontal}`;
}

function createSnippetHTML(boardName, pin, isRotated) {
    if (!pin) return `<div class="pin-snippet"></div>`;
    
    // Calculate position based on the same rotation logic as index.html
    const displayX = isRotated ? (100 - pin.y) : pin.x;
    const displayY = isRotated ? pin.x : pin.y;
    
    const zoom = 8; // Increased zoom for better pin visibility
    return `
        <div class="pin-snippet">
            <img src="./boards/${boardName}.JPG" 
                 style="width: ${100 * zoom}%; 
                        left: calc(50% - ${displayX * zoom}% + ${zoom/2 * 100}%); 
                        top: calc(50% - ${displayY * zoom}% + ${zoom/2 * 100}%); 
                        transform: translate(-50%, -50%);">
        </div>`;
}

async function loadData() {
    const pathClean = window.location.pathname.replace(/\/reports\.html$/, "").replace(/\/$/, ""); 
    const folderParts = pathClean.split("/");
    const showFolderName = decodeURIComponent(folderParts.pop() || "default");
    const showNameForFirebase = showFolderName.replace(/\s+/g, '_');

    const manifestRes = await fetch("./boards/manifest.json");
    const boardNames = await manifestRes.json();
    const boardMeta = {};

    for (const name of boardNames) {
        const res = await fetch(`./boards/${name}.json`);
        const data = await res.json();
        
        // Check image orientation for rotation logic
        const img = new Image();
        img.src = `./boards/${name}.JPG`;
        await new Promise(resolve => img.onload = resolve);
        
        const isRotated = img.width > img.height;
        
        boardMeta[name] = {
            pins: data.predictions || data.output?.predictions || [],
            isRotated: isRotated
        };
    }

    db.ref(`claims/${showNameForFirebase}`).on('value', snapshot => {
        globalReportData = { raw: snapshot.val() || {}, meta: boardMeta, showName: showFolderName };
        renderReports(globalReportData.raw, boardMeta);
    });
}

function renderReports(data, boardMeta) {
    const userStats = {};
    const liveFeed = [];
    const popularity = [];
    const globalPinCounts = {};
    const boardKeys = Object.keys(boardMeta);
    
    Object.keys(data).forEach(pinKey => globalPinCounts[pinKey] = Object.keys(data[pinKey]).length);

    Object.entries(data).forEach(([pinKey, users]) => {
        const [bName, pIdx] = pinKey.split("-");
        const boardIndex = boardKeys.indexOf(bName) + 1;
        const meta = boardMeta[bName];
        if (!meta) return;

        const pinData = meta.pins[pIdx];
        const quad = pinData ? getQuadrant(pinData.x, pinData.y, meta.isRotated) : "Unknown";
        const locStr = `Board ${boardIndex} (${quad})`;
        const snippet = createSnippetHTML(bName, pinData, meta.isRotated);

        const userEntries = Object.entries(users).sort((a,b) => a[1].time - b[1].time);
        popularity.push({ snippet, loc: locStr, count: userEntries.length, details: userEntries.map(([u, t]) => `${u}`).join(", ") });

        userEntries.forEach(([username, metaData]) => {
            if (!userStats[username]) userStats[username] = { lastAction: 0, unique: 0, contested: 0 };
            if (metaData.time > userStats[username].lastAction) userStats[username].lastAction = metaData.time;
            if (globalPinCounts[pinKey] === 1) userStats[username].unique++; else userStats[username].contested++;
            liveFeed.push({ snippet, loc: locStr, user: username, time: metaData.time });
        });
    });

    // Render User Tally
    const userTable = document.querySelector("#userTallyTable tbody");
    let totalU = 0, totalC = 0, totalT = 0;
    userTable.innerHTML = Object.entries(userStats).sort((a,b) => a[0].localeCompare(b[0])).map(([u, s]) => {
        totalU += s.unique; totalC += s.contested; totalT += (s.unique + s.contested);
        return `<tr><td><strong>${u}</strong></td><td class="timestamp">${new Date(s.lastAction).toLocaleTimeString()}</td><td>${s.unique}</td><td>${s.contested}</td><td><strong>${s.unique + s.contested}</strong></td></tr>`;
    }).join('');
    document.getElementById("userTallyFooter").innerHTML = `<td colspan="2">TOTALS</td><td>${totalU}</td><td>${totalC}</td><td>${totalT}</td>`;

    // Render Live Feed
    const feedTable = document.querySelector("#liveFeedTable tbody");
    feedTable.innerHTML = liveFeed.sort((a,b) => b.time - a.time).map(f => `<tr><td>${f.snippet}</td><td>${f.loc}</td><td><strong>${f.user}</strong></td><td class="timestamp">${new Date(f.time).toLocaleTimeString()}</td></tr>`).join('');

    // Render Popularity
    const popTable = document.querySelector("#popularityTable tbody");
    popTable.innerHTML = popularity.sort((a,b) => b.count - a.count).map(p => `<tr><td>${p.snippet}</td><td>${p.loc}</td><td><strong>${p.count}</strong></td><td style="font-size: 11px; color: #666;">${p.details}</td></tr>`).join('');
}

function downloadCSV() {
    if (!globalReportData) return alert("No data.");
    let csvContent = "data:text/csv;charset=utf-8,Board-Pin,Location,Username,Timestamp,Status\n";
    const { raw, meta, showName } = globalReportData;
    const boardKeys = Object.keys(meta);

    Object.entries(raw).forEach(([pinKey, users]) => {
        const [bName, pIdx] = pinKey.split("-");
        const boardIndex = boardKeys.indexOf(bName) + 1;
        const pinMeta = meta[bName];
        const quad = pinMeta.pins[pIdx] ? getQuadrant(pinMeta.pins[pIdx].x, pinMeta.pins[pIdx].y, pinMeta.isRotated) : "Unknown";
        const status = Object.keys(users).length === 1 ? "Unique" : "Contested";

        Object.entries(users).forEach(([user, m]) => {
            csvContent += `${pinKey},Board ${boardIndex} (${quad}),${user},${new Date(m.time).toLocaleString().replace(/,/g,'')},${status}\n`;
        });
    });

    const link = document.createElement("a");
    link.setAttribute("href", encodeURI(csvContent));
    link.setAttribute("download", `FinsAndPins_${showName}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>
</body>
</html>
