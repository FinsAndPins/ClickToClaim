<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClickToPrice – Fins & Pins</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0; background: #111; color: #fff;
      display: flex; flex-direction: column; height: 100dvh;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    #topBar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px; background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
    }
    #progress { font-size: 13px; color: #888; }
    #reviewerDisplay { font-size: 13px; color: #666; }

    /* ── TITLE STRIP ── */
    #titleStrip {
      flex-shrink: 0;
      padding: 5px 12px 4px;
      background: #1a1a1a;
      border-bottom: 1px solid #222;
    }
    #pinTitle {
      font-size: 13px; color: #aaa; line-height: 1.3;
      width: 100%; background: transparent;
      border: none; border-bottom: 1.5px solid transparent;
      outline: none; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: text; padding: 0;
    }
    #pinTitle:focus {
      border-bottom-color: #e67e22; color: #fff;
    }

    /* ── PHOTO ── */
    #photoWrap {
      flex: 1; min-height: 0;
      display: flex; align-items: stretch; justify-content: center;
      padding: 6px 6px 4px;
      background: #111;
    }
    #pinPhoto {
      width: 100%; height: 100%;
      object-fit: contain; border-radius: 12px;
      background: #222;
    }

    /* ── PRICE AREA ── */
    #priceArea {
      flex-shrink: 0;
      padding: 8px 12px 6px;
      display: flex; align-items: center; gap: 10px;
    }
    #priceLabel {
      font-size: 11px; color: #666; text-transform: uppercase;
      letter-spacing: 0.6px; white-space: nowrap;
    }
    #priceWrap {
      display: flex; align-items: center; gap: 4px;
      flex: 1;
    }
    #dollarSign {
      font-size: 28px; font-weight: 700; color: #f39c12;
    }
    #priceInput {
      flex: 1; max-width: 140px;
      background: #1e1e1e; color: #f39c12;
      border: 1.5px solid #4a3a00; border-radius: 10px;
      padding: 10px 14px; font-size: 32px; font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      outline: none; text-align: center;
      -moz-appearance: textfield;
    }
    #priceInput:focus { border-color: #f39c12; }
    #priceInput::-webkit-inner-spin-button,
    #priceInput::-webkit-outer-spin-button { -webkit-appearance: none; }
    #ebayHint {
      font-size: 12px; color: #555;
      white-space: nowrap;
    }

    /* ── QUICK PRICE CHIPS ── */
    #priceChips {
      flex-shrink: 0;
      display: flex; gap: 8px; padding: 0 12px 6px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .chip {
      background: #2a2a2a; color: #ccc;
      border: 1px solid #333; border-radius: 20px;
      padding: 6px 14px; font-size: 15px; font-weight: 600;
      white-space: nowrap; cursor: pointer; flex-shrink: 0;
    }
    .chip:active { background: #3a3a1a; color: #f39c12; border-color: #f39c12; }

    /* ── BUTTONS ── */
    #btnRow {
      flex-shrink: 0;
      display: flex; gap: 10px;
      padding: 8px 12px 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }
    #confirmBtn {
      flex: 1;
      background: #e67e22; color: #fff;
      border: none; border-radius: 14px;
      font-size: 20px; font-weight: 700;
      padding: 16px 10px; cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.15s, transform 0.1s;
      -webkit-user-select: none; user-select: none;
    }
    #confirmBtn:active { background: #ca6f1e; transform: scale(0.97); }

    #nextBtn, #backBtn {
      background: #2a2a2a; color: #888;
      border: 1px solid #333; border-radius: 14px;
      font-size: 15px; font-weight: 500;
      padding: 16px 18px; cursor: pointer;
      white-space: nowrap;
      -webkit-user-select: none; user-select: none;
    }
    #nextBtn:active, #backBtn:not(:disabled):active { background: #1a1a1a; color: #aaa; }
    #backBtn:disabled { opacity: 0.25; cursor: default; }

    /* ── LOADING / DONE ── */
    #loadScreen {
      position: fixed; inset: 0; background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      z-index: 10;
    }
    #loadScreen p { color: #888; font-size: 15px; margin: 0; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #333; border-top-color: #e67e22;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #doneScreen {
      position: fixed; inset: 0; background: #111;
      display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; padding: 30px;
    }
    #doneScreen .done-emoji { font-size: 80px; line-height: 1; margin-bottom: 6px; }
    #doneScreen h2 { font-size: 36px; margin: 0; color: #e67e22; }
    #doneScreen .done-sub { font-size: 22px; color: #e67e22; margin: 0; }
    #doneScreen p { color: #888; font-size: 15px; margin: 0; text-align: center; }

    /* ── REVIEWER MODAL ── */
    #reviewerModal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 20; padding: 20px;
    }
    .modalBox {
      background: #1e1e1e; border-radius: 16px;
      padding: 28px 24px; width: 100%; max-width: 360px;
    }
    .modalBox h3 { margin: 0 0 6px; font-size: 20px; }
    .modalBox p { margin: 0 0 18px; color: #888; font-size: 14px; }
    .modalBox input {
      width: 100%; background: #2a2a2a; color: #fff;
      border: 1.5px solid #444; border-radius: 10px;
      padding: 12px 14px; font-size: 18px; outline: none;
      font-family: inherit; margin-bottom: 14px;
    }
    .modalBox input:focus { border-color: #e67e22; }
    .modalBox button {
      width: 100%; background: #e67e22; color: #fff;
      border: none; border-radius: 12px;
      font-size: 18px; font-weight: 700;
      padding: 14px; cursor: pointer;
    }
    .modalBox button:active { background: #ca6f1e; }
  </style>
</head>
<body>

<!-- Reviewer modal -->
<div id="reviewerModal" style="display:none;">
  <div class="modalBox">
    <h3>Who are you?</h3>
    <p>Enter your Whatnot handle</p>
    <input id="reviewerInput" type="text" placeholder="@YourHandle" autocomplete="off">
    <button id="reviewerSaveBtn">Start Pricing</button>
  </div>
</div>

<!-- Loading screen -->
<div id="loadScreen">
  <div class="spinner"></div>
  <p id="loadMsg">Loading pins…</p>
</div>

<!-- Done screen -->
<div id="doneScreen">
  <div class="done-emoji">💰</div>
  <h2>Congratulations!</h2>
  <p class="done-sub" id="doneMsg"></p>
  <p id="doneStats"></p>
</div>

<!-- Main UI -->
<div id="topBar" style="display:none;">
  <span id="progress">– / –</span>
  <span id="reviewerDisplay"></span>
</div>

<div id="titleStrip" style="display:none;">
  <input id="pinTitle" type="text" value="—" autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<div id="photoWrap" style="display:none;">
  <img id="pinPhoto" src="" alt="Pin photo">
</div>

<div id="priceArea" style="display:none;">
  <span id="priceLabel">Price</span>
  <div id="priceWrap">
    <span id="dollarSign">$</span>
    <input id="priceInput" type="number" min="5" max="9999" step="5" inputmode="numeric">
  </div>
  <span id="ebayHint"></span>
</div>

<div id="priceChips" style="display:none;">
  <div class="chip" data-price="10">$10</div>
  <div class="chip" data-price="15">$15</div>
  <div class="chip" data-price="20">$20</div>
  <div class="chip" data-price="25">$25</div>
  <div class="chip" data-price="30">$30</div>
  <div class="chip" data-price="35">$35</div>
  <div class="chip" data-price="40">$40</div>
  <div class="chip" data-price="50">$50</div>
  <div class="chip" data-price="75">$75</div>
</div>

<div id="btnRow" style="display:none;">
  <button id="backBtn" disabled>← Back</button>
  <button id="confirmBtn">$ Confirm Price</button>
  <button id="nextBtn">Skip →</button>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
  authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
  databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
  projectId: "fins-and-pins-click-to-claim",
  storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
  messagingSenderId: "31512845258",
  appId: "1:31512845258:web:2124fae24cfee229084d33"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const FB_PATH = 'price_review/ClickToPrice20260402';
const PENDING_URL = './pending_items.json';
const LS_REVIEWER = 'fp_reviewer_price';

let reviewer = '';
let queue = [];
let currentIdx = 0;
let allPins = {};
let confirmed = {};
let history = [];   // [{idx, confirmed, key}]
let sessionCount = 0;

// Pricing rules: $10 floor, round to nearest $5
function adjustPrice(raw) {
  if (!raw || isNaN(raw)) return 10;
  const p = Math.max(10, parseFloat(raw));
  return Math.round(p / 5) * 5;
}

// ── REVIEWER SETUP ───────────────────────────────────────────────────────────
function initReviewer() {
  const saved = localStorage.getItem(LS_REVIEWER);
  if (saved) { reviewer = saved; start(); }
  else { document.getElementById('reviewerModal').style.display = 'flex'; }
}

document.getElementById('reviewerSaveBtn').addEventListener('click', () => {
  const val = document.getElementById('reviewerInput').value.trim();
  if (!val) return;
  reviewer = val.startsWith('@') ? val : '@' + val;
  localStorage.setItem(LS_REVIEWER, reviewer);
  document.getElementById('reviewerModal').style.display = 'none';
  start();
});
document.getElementById('reviewerInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('reviewerSaveBtn').click();
});

// ── MAIN FLOW ────────────────────────────────────────────────────────────────
async function start() {
  setLoad('Loading pins…');
  let pending;
  try {
    const res = await fetch(PENDING_URL);
    pending = await res.json();
  } catch (e) {
    setLoad('❌ Could not load pending_items.json'); return;
  }
  allPins = pending;

  setLoad('Checking prices…');
  const snap = await db.ref(FB_PATH).get();
  confirmed = snap.exists() ? snap.val() : {};

  // Fetch title-confirmed pins to prioritize (show those first)
  const titleSnap = await db.ref('description_review/ClickToDescribe20260402').get();
  const titleConfirmed = titleSnap.exists() ? titleSnap.val() : {};

  // Build queue: title-confirmed pins first, then rest (each group seeded-shuffled)
  const allKeys = Object.keys(pending);
  const seed = strToSeed(reviewer);
  const unconfirmed = allKeys.filter(k => !confirmed[k.replace(/\./g, '_')]);
  const priority = unconfirmed.filter(k =>  titleConfirmed[k.replace(/\./g, '_')]);
  const rest     = unconfirmed.filter(k => !titleConfirmed[k.replace(/\./g, '_')]);
  queue = [...seededShuffle(priority, seed), ...seededShuffle(rest, seed)];

  document.getElementById('loadScreen').style.display = 'none';

  if (queue.length === 0) { showDone(allKeys.length); return; }

  showMainUI();
  showPin(0);
}

function setLoad(msg) {
  document.getElementById('loadMsg').textContent = msg;
  document.getElementById('loadScreen').style.display = 'flex';
}

function showMainUI() {
  ['topBar','titleStrip','photoWrap','priceArea','priceChips','btnRow'].forEach(id => {
    document.getElementById(id).style.display = '';
  });
  document.getElementById('reviewerDisplay').textContent = reviewer;
}

function showPin(idx) {
  currentIdx = idx;
  if (idx >= queue.length) { showDone(Object.keys(allPins).length); return; }

  const filename = queue[idx];
  const pin = allPins[filename];

  const total = Object.keys(allPins).length;
  const done = total - queue.length + idx;
  document.getElementById('progress').textContent =
    `${done + 1} / ${total}  (${queue.length - idx} left)`;

  // Title strip (final character first)
  document.getElementById('pinTitle').value = cleanTitle(pin.final_character || 'Unknown');
  updateBackBtn();

  // Photo
  const photo = document.getElementById('pinPhoto');
  photo.src = '';
  photo.src = pin.crop || pin.thumb || '';

  // Price
  const rawEbay = pin.price;
  const suggested = adjustPrice(rawEbay);
  document.getElementById('priceInput').value = suggested;
  document.getElementById('ebayHint').textContent =
    rawEbay ? `eBay: $${parseFloat(rawEbay).toFixed(0)}` : '';
}

function showDone(total) {
  ['topBar','titleStrip','photoWrap','priceArea','priceChips','btnRow'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });
  document.getElementById('doneScreen').style.display = 'flex';
  document.getElementById('doneMsg').textContent = `All ${total} pins priced!`;
  document.getElementById('doneStats').textContent = sessionCount > 0
    ? `You confirmed ${sessionCount} pin${sessionCount !== 1 ? 's' : ''} this session. Amazing work, ${reviewer}!`
    : `Great work, ${reviewer}! You can close this tab.`;
}

// ── QUICK PRICE CHIPS ────────────────────────────────────────────────────────
document.getElementById('priceChips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.getElementById('priceInput').value = chip.dataset.price;
});

// ── CONFIRM ──────────────────────────────────────────────────────────────────
document.getElementById('confirmBtn').addEventListener('click', async () => {
  const filename = queue[currentIdx];
  const pin = allPins[filename];
  const finalPrice = parseInt(document.getElementById('priceInput').value) || 10;
  const suggestedPrice = adjustPrice(pin.price);
  const wasAdjusted = finalPrice !== suggestedPrice;
  const baseTitle = cleanTitle(pin.final_character || 'Unknown');
  const finalTitle = document.getElementById('pinTitle').value.trim() || baseTitle;
  const titleEdited = finalTitle !== baseTitle;

  const key = filename.replace(/\./g, '_');
  await db.ref(`${FB_PATH}/${key}`).set({
    filename,
    ebay_price: pin.price || null,
    suggested_price: suggestedPrice,
    final_price: finalPrice,
    was_adjusted: wasAdjusted,
    final_title: finalTitle,
    title_edited: titleEdited,
    reviewer,
    timestamp: Date.now()
  });

  history.push({ idx: currentIdx, confirmed: true, key });
  if (history.length > 3) history.shift();
  confirmed[key] = true;
  sessionCount++;
  allPins[filename].ai_title = finalTitle;  // keep edit if user goes back then re-confirms
  showPin(currentIdx + 1);
});

// ── NEXT (skip) ──────────────────────────────────────────────────────────────
document.getElementById('nextBtn').addEventListener('click', () => {
  history.push({ idx: currentIdx, confirmed: false });
  if (history.length > 3) history.shift();
  showPin(currentIdx + 1);
});

// ── BACK ──────────────────────────────────────────────────────────────────────
document.getElementById('backBtn').addEventListener('click', async () => {
  if (history.length === 0) return;
  const last = history.pop();
  if (last.confirmed) {
    await db.ref(`${FB_PATH}/${last.key}`).remove();
    delete confirmed[last.key];
    sessionCount = Math.max(0, sessionCount - 1);
  }
  showPin(last.idx);
});

function updateBackBtn() {
  document.getElementById('backBtn').disabled = history.length === 0;
}

// ── TITLE CLEANUP ────────────────────────────────────────────────────────────
function cleanTitle(t) {
  if (!t) return '';
  t = t.replace(/\b(new\s+in\s+package|NIP|various)\b/gi, '');
  t = t.replace(/\bLE\s*[/]?\s*\d+\b/g, 'LE');
  t = t.replace(/\bLimited\s+Edition\s+(?:of\s+)?\d+\b/gi, 'Limited Edition');
  t = t.replace(/\s{2,}/g, ' ').replace(/^[\s,\-–]+|[\s,\-–]+$/g, '').trim();
  return t;
}

// ── SEEDED SHUFFLE ───────────────────────────────────────────────────────────
function strToSeed(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  return h >>> 0;
}
function seededShuffle(arr, seed) {
  let s = seed;
  function rand() {
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
    return (s >>> 0) / 0x100000000;
  }
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── KICK OFF ────────────────────────────────────────────────────────────────
initReviewer();
</script>
</body>
</html>
