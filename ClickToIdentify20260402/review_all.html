<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClickToIdentify Review All</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #eee; }
    #top { position: sticky; top: 0; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 10px; }
    #top a { color: #e67e22; text-decoration: none; font-weight: 600; }
    #stats { color: #888; font-size: 13px; margin-top: 6px; }
    #list { padding: 10px; display: grid; gap: 10px; }
    .row { border: 1px solid #2f2f2f; border-radius: 10px; background: #1b1b1b; padding: 8px; display: grid; grid-template-columns: 84px 1fr; gap: 10px; }
    .row img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; background: #222; }
    .line { font-size: 12px; color: #bbb; margin: 2px 0; }
    .line b { color: #ddd; }
    .pill { display: inline-block; border: 1px solid #444; border-radius: 999px; padding: 2px 8px; font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="top">
    <a href="./index.html">&larr; Back to Identify</a>
    <div id="stats">Loading...</div>
  </div>
  <div id="list"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB5HoTCon9uIFJqnF506tB_jORAG1HvI7o",
      authDomain: "fins-and-pins-click-to-claim.firebaseapp.com",
      databaseURL: "https://fins-and-pins-click-to-claim-default-rtdb.firebaseio.com/",
      projectId: "fins-and-pins-click-to-claim",
      storageBucket: "fins-and-pins-click-to-claim.firebasestorage.app",
      messagingSenderId: "31512845258",
      appId: "1:31512845258:web:2124fae24cfee229084d33"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const FB_PATH = "identify_review/ClickToIdentify20260402_dev";

    function fmtPrice(p) {
      if (p === null || p === undefined || p === "") return "-";
      const n = parseFloat(p);
      if (isNaN(n)) return "-";
      return "$" + Math.round(n);
    }
    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function run() {
      const snap = await db.ref(FB_PATH).get();
      const data = snap.exists() ? snap.val() : {};
      const rows = Object.values(data).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      document.getElementById("stats").textContent = `${rows.length} identified records`;
      const list = document.getElementById("list");
      list.innerHTML = "";
      for (const r of rows) {
        const img = (r.selected_listing && (r.selected_listing.thumb || r.selected_listing.crop)) || "";
        const mode = r.mode || "match_only";
        const title = (r.selected_listing && r.selected_listing.title) || "";
        const line = document.createElement("div");
        line.className = "row";
        line.innerHTML = `
          <img src="${img}" alt="">
          <div>
            <div class="line"><b>${esc(r.filename)}</b></div>
            <div class="line">Character: <b>${esc(r.final_character)}</b></div>
            <div class="line">Mode: <b>${esc(mode)}</b> | eBay: <b>${fmtPrice(r.ebay_price || (r.selected_listing && r.selected_listing.price))}</b> | Our: <b>${fmtPrice(r.final_price)}</b></div>
            <div class="line">Listing: ${esc(title)}</div>
            <span class="pill">${esc(r.reviewer || "")}</span>
          </div>`;
        list.appendChild(line);
      }
    }

    run().catch(err => {
      document.getElementById("stats").textContent = "Error loading records.";
      console.error(err);
    });
  </script>
</body>
</html>
